name: Synchronize BU-SP3 Batch 1 state

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-bu-sp3-batch1.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize BU-SP3 Batch 1 durable state
        shell: python
        run: |
          from pathlib import Path

          def replace_one(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one occurrence, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # BU witness README: current tally + Batch-1 closure + next activity.
          replace_one(
              'secondary-witnesses/bharathiar-university/README.md',
              '- Volume III: **50** — 50 INVESTIGATE;',
              '- Volume III: **50** — 0 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 40 INVESTIGATE;',
              'BU README SP3 tally')
          replace_one(
              'secondary-witnesses/bharathiar-university/README.md',
              'Current hardened crosswalk: **68 MATCHED / 0 POSSIBLE / 58 NOT YET REPRESENTED / 50 INVESTIGATE = 176**.',
              'Current hardened crosswalk: **68 MATCHED / 0 POSSIBLE / 68 NOT YET REPRESENTED / 40 INVESTIGATE = 176**.',
              'BU README total tally')
          replace_one(
              'secondary-witnesses/bharathiar-university/README.md',
              '## Next activity\n\nProceed to **BU-SP3 Identity Investigation Batch 1 — entries 1–10 in source order**. Use actual Volume-III payload/event/source context; report/crosswalk only; do not mutate FINAL-CLEARED Tamil or RELEASE-CLEARED English.',
              '### BU-SP3 identity investigation Batch 1 — COMPLETE\n\nReport: `comparisons/13-shower-of-poetry-vol-3-identity-investigation-batch-01.md`. Entries **1–10** were inspected from actual Volume-III page images, physical pages **27–59** / printed pages **1–33**. Result: **0 MATCHED / 10 NOT YET REPRESENTED / 0 unresolved**; Tamil / RELEASE-CLEARED English mutations **0 / 0**. Current BU-SP3 state: **0 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 40 INVESTIGATE = 50**.\n\n## Next activity\n\nProceed to **BU-SP3 Identity Investigation Batch 2 — entries 11–20 in source order**. Use actual Volume-III payload/event/source context; report/crosswalk only; do not mutate FINAL-CLEARED Tamil or RELEASE-CLEARED English.',
              'BU README next activity')

          # Master crosswalk: per-book/global state and next activity.
          replace_one(
              'secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md',
              '| BU-SP3 | *Shower of Poetry*, Volume III | 220 | 80,185,514 | `90d64eb19a75c93ae78a5081fe1f6ad1733fc92dff1568e65eadb6bb5213afb6` | 50 | 50 INVESTIGATE |',
              '| BU-SP3 | *Shower of Poetry*, Volume III | 220 | 80,185,514 | `90d64eb19a75c93ae78a5081fe1f6ad1733fc92dff1568e65eadb6bb5213afb6` | 50 | 0 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 40 INVESTIGATE |',
              'master SP3 row')
          replace_one(
              'secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md',
              '**Total: 176 entries — 68 MATCHED / 0 POSSIBLE / 58 NOT YET REPRESENTED / 50 INVESTIGATE.**',
              '**Total: 176 entries — 68 MATCHED / 0 POSSIBLE / 68 NOT YET REPRESENTED / 40 INVESTIGATE.**',
              'master total')
          replace_one(
              'secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md',
              'Four-book hardened tally: **68 MATCHED / 0 POSSIBLE / 58 NOT YET REPRESENTED / 50 INVESTIGATE = 176**.',
              'Four-book tally after BU-SP1 identity closure: **68 MATCHED / 0 POSSIBLE / 58 NOT YET REPRESENTED / 50 INVESTIGATE = 176**.',
              'master historical SP1 tally label')
          replace_one(
              'secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md',
              '## Exact next activity\n\nProceed to **BU-SP3 Identity Investigation Batch 1 — entries 1–10**. Harden identities only from actual Volume-III payload/event/source context and current repository inventories; report/crosswalk only.',
              '## BU-SP3 identity investigation Batch 1 — COMPLETE\n\nReport: `comparisons/13-shower-of-poetry-vol-3-identity-investigation-batch-01.md`. Entries **1–10** → **NOT YET REPRESENTED** after direct page-image/payload review; no MATCHED or unresolved rows in the batch. Current BU-SP3 state: **0 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 40 INVESTIGATE = 50**. Current four-book tally: **68 MATCHED / 0 POSSIBLE / 68 NOT YET REPRESENTED / 40 INVESTIGATE = 176**. Tamil / released-English mutations: **0 / 0**.\n\n## Exact next activity\n\nProceed to **BU-SP3 Identity Investigation Batch 2 — entries 11–20**. Harden identities only from actual Volume-III payload/event/source context and current repository inventories; report/crosswalk only.',
              'master next activity')

          # Volume-III source metadata: preserve onboarding history but add current state.
          replace_one(
              'secondary-witnesses/bharathiar-university/shower-of-poetry-vol-3/source.md',
              'See `../MASTER_CROSSWALK.md` and `crosswalk.md`. The initial onboarding intentionally leaves all 50 entries at `INVESTIGATE` until an item-level repository matching pass is performed. English title similarity alone is insufficient to assert canonical identity.',
              'See `../MASTER_CROSSWALK.md` and `crosswalk.md`. Initial onboarding left all 50 entries at `INVESTIGATE`; identity Batch 1 has now hardened entries **1–10** to `NOT YET REPRESENTED` from actual payload/context review. Current Volume-III state: **0 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 40 INVESTIGATE = 50**. English title similarity alone is insufficient to assert canonical identity.',
              'SP3 source current state')

          # Root handover.
          replace_one(
              'HANDOVER.md',
              'Batch 3 final ten: **entry 45 MATCHED** `கலைஞரின் கவிதைகள்` item 67; entries **43, 44, 46, 47, 48, 49, 50, 51, 52 NOT YET REPRESENTED**. Final BU-SP1 identity state: **33 MATCHED / 0 POSSIBLE / 19 NOT YET REPRESENTED / 0 INVESTIGATE = 52**. Four-book current tally: **68 MATCHED / 0 POSSIBLE / 58 NOT YET REPRESENTED / 50 INVESTIGATE = 176**. Tamil / released-English mutations: **0 / 0**.',
              'Batch 3 final ten: **entry 45 MATCHED** `கலைஞரின் கவிதைகள்` item 67; entries **43, 44, 46, 47, 48, 49, 50, 51, 52 NOT YET REPRESENTED**. Final BU-SP1 identity state: **33 MATCHED / 0 POSSIBLE / 19 NOT YET REPRESENTED / 0 INVESTIGATE = 52**. Four-book tally immediately after BU-SP1 closure: **68 MATCHED / 0 POSSIBLE / 58 NOT YET REPRESENTED / 50 INVESTIGATE = 176**. Tamil / released-English mutations: **0 / 0**.',
              'handover historical SP1 tally')
          replace_one(
              'HANDOVER.md',
              '## Exact next activity\n\nRun **BU-SP3 Identity Investigation Batch 1 — entries 1–10 in source order**. Report/crosswalk only; no FINAL-CLEARED Tamil or RELEASE-CLEARED English mutation.',
              '## BU-SP3 identity investigation Batch 1 — COMPLETE\n\nReport: `secondary-witnesses/bharathiar-university/comparisons/13-shower-of-poetry-vol-3-identity-investigation-batch-01.md`. Entries **1–10** were hardened **NOT YET REPRESENTED** from direct physical pages **27–59** / printed pages **1–33**. Batch result: **PASS / REPORT-ONLY — 10/10; 0 MATCHED / 10 NOT YET REPRESENTED / 0 unresolved**. BU-SP3 now stands at **0 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 40 INVESTIGATE = 50**; four-book tally **68 MATCHED / 0 POSSIBLE / 68 NOT YET REPRESENTED / 40 INVESTIGATE = 176**. Tamil / released-English mutations: **0 / 0**.\n\n## Exact next activity\n\nRun **BU-SP3 Identity Investigation Batch 2 — entries 11–20 in source order**. Report/crosswalk only; no FINAL-CLEARED Tamil or RELEASE-CLEARED English mutation.',
              'handover next activity')

          # Phase plan.
          replace_one(
              'TRANSCRIPTION_PHASE_PLAN.md',
              '### Current comparison activity — NEXT\n\n**BU-SP3 Identity Investigation Batch 1 — entries 1–10 in source order.**',
              '### BU-SP3 identity investigation Batch 1 — COMPLETE\n\nReport: `secondary-witnesses/bharathiar-university/comparisons/13-shower-of-poetry-vol-3-identity-investigation-batch-01.md`. Entries **1–10** → **10 NOT YET REPRESENTED**, with **0 MATCHED / 0 unresolved** and Tamil / released-English mutations **0 / 0**. Current BU-SP3: **0 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 40 INVESTIGATE = 50**.\n\n### Current comparison activity — NEXT\n\n**BU-SP3 Identity Investigation Batch 2 — entries 11–20 in source order.**',
              'phase current activity')
          replace_one(
              'TRANSCRIPTION_PHASE_PLAN.md',
              '1. BU-SP3 — item-level matching of the **50 INVESTIGATE** entries, beginning with entries 1–10;',
              '1. BU-SP3 — continue item-level matching of the **40 remaining INVESTIGATE** entries, next entries 11–20;',
              'phase planned sequence')
          replace_one(
              'TRANSCRIPTION_PHASE_PLAN.md',
              '## Exact next activity\n\nProceed with **BU-SP3 Identity Investigation Batch 1 — entries 1–10 — identity/crosswalk report only**.',
              '## Exact next activity\n\nProceed with **BU-SP3 Identity Investigation Batch 2 — entries 11–20 — identity/crosswalk report only**.',
              'phase exact next')

          # Root README was stale from pre-SP1-closure state; bring it fully current.
          replace_one(
              'README.md',
              'Their **176 TOC entries** are durably indexed at `secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md`. Current hardened state after BU-TT closure and BU-SP1 identity Batches 1–2: **67 MATCHED / 0 POSSIBLE / 49 NOT YET REPRESENTED / 60 INVESTIGATE**.',
              'Their **176 TOC entries** are durably indexed at `secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md`. Current hardened state after BU-SP1 identity closure and BU-SP3 Batch 1: **68 MATCHED / 0 POSSIBLE / 68 NOT YET REPRESENTED / 40 INVESTIGATE**.',
              'root README global state')
          replace_one(
              'README.md',
              'Exact next secondary-witness activity: **BU-SP1 Identity Investigation Batch 3 — final Volume-I entries 43–52; report/crosswalk only, no Tamil or released-English mutation.**',
              'Exact next secondary-witness activity: **BU-SP3 Identity Investigation Batch 2 — Volume-III entries 11–20; report/crosswalk only, no Tamil or released-English mutation.**',
              'root README top next')
          replace_one(
              'README.md',
              'Current next activity: **BU-SP1 Identity Investigation Batch 3 — entries 43–52; report/crosswalk only.**',
              'Current next activity: **BU-SP3 Identity Investigation Batch 2 — entries 11–20; report/crosswalk only.**',
              'root README tail next')

      - name: Commit synchronized state
        shell: bash
        run: |
          git config user.name "pugazg"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md HANDOVER.md TRANSCRIPTION_PHASE_PLAN.md \
            secondary-witnesses/bharathiar-university/README.md \
            secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md \
            secondary-witnesses/bharathiar-university/shower-of-poetry-vol-3/source.md
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize BU-SP3 identity Batch 1 state"
          git push origin HEAD:main
