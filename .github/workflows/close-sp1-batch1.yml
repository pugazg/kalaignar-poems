name: Close BU-SP1 payload Batch 1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/close-sp1-batch1.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize Batch 1 status records
        shell: python
        run: |
          from pathlib import Path

          report = '`comparisons/07-shower-of-poetry-vol-1-matched-batch-01.md`'
          next_entries = '**19, 21, 22, 23, 25, 26, 27, 28, 30 and 33**'

          # secondary-witness README
          p = Path('secondary-witnesses/bharathiar-university/README.md')
          t = p.read_text(encoding='utf-8')
          old = '''## Next activity\n\nBegin BU-SP1 payload-comparison Batch 1 for the first **10 confirmed MATCHED entries in source order: 1, 8, 9, 11, 12, 13, 14, 15, 16 and 18**. Compare each against FINAL-CLEARED Tamil and RELEASE-CLEARED English and produce a report only.\n'''
          new = '''### BU-SP1 payload comparison Batch 1 — COMPLETE\n\nReport: `comparisons/07-shower-of-poetry-vol-1-matched-batch-01.md`.\n\nCompared confirmed MATCHED entries **1, 8, 9, 11, 12, 13, 14, 15, 16 and 18** against FINAL-CLEARED Tamil and RELEASE-CLEARED English. Result: **PASS / REPORT-ONLY — 10/10**; Tamil/source correction candidates **0**; released-English correction candidates **0**; mutations **0 / 0**.\n\nHigh-value diagnostics: BU entry 1 mistranslates `பஞ்சைகளல்ல` as **cowards** rather than paupers and inserts **tricks and frauds** into the opening; entry 8 flattens the `Nalla Thambi / Panam / Manamagal` film-title chain and reads source `கிந்தன்` as **Kandan**; entry 13 omits the extended river-name love sequence; entry 14 heavily condenses the water-family architecture; entry 15 omits the Muthusamy → Muthamma dream sequence; entry 18 mistranslates `மணக்கணக்கு` as **mental calculation**, `வேங்கை` as **lion**, and source river multiplication as multiplying **rains**. These are secondary-witness weaknesses, not repository defects.\n\n## Next activity\n\nProceed with **BU-SP1 payload-comparison Batch 2** for confirmed MATCHED entries **19, 21, 22, 23, 25, 26, 27, 28, 30 and 33**. Use direct exact-byte rendering where physical PDF pages exceed the normal 150-page renderer window. Report only; do not mutate Tamil or released English.\n'''
          if old not in t:
              raise SystemExit('README next block not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          # master crosswalk
          p = Path('secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md')
          t = p.read_text(encoding='utf-8')
          old = '''## Exact next activity\n\nCompare the first ten confirmed BU-SP1 MATCHED payloads in source order: **1, 8, 9, 11, 12, 13, 14, 15, 16, 18**. Report only; no Tamil/released-English mutation.\n'''
          new = '''## BU-SP1 payload comparison Batch 1 — COMPLETE\n\n`comparisons/07-shower-of-poetry-vol-1-matched-batch-01.md` compares confirmed MATCHED entries **1, 8, 9, 11, 12, 13, 14, 15, 16 and 18**. Result: **PASS / REPORT-ONLY — 10/10**, Tamil/source correction candidates **0**, released-English correction candidates **0**, mutations **0 / 0**. The dominant BU pattern is condensation/smoothing and loss of source puns; strongest diagnostics include `பஞ்சைகளல்ல` → **cowards**, `கிந்தன்` → **Kandan**, major river/water-family/Muthamma omissions, and `மணக்கணக்கு` → **mental calculation**.\n\n## Exact next activity\n\nRun BU-SP1 payload-comparison Batch 2 for confirmed MATCHED entries **19, 21, 22, 23, 25, 26, 27, 28, 30 and 33**. Report only; no Tamil/released-English mutation.\n'''
          if old not in t:
              raise SystemExit('MASTER next block not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          # root HANDOVER
          p = Path('HANDOVER.md')
          t = p.read_text(encoding='utf-8')
          old = '''## Exact next activity\n\nRun BU-SP1 payload-comparison Batch 1 for confirmed MATCHED entries **1, 8, 9, 11, 12, 13, 14, 15, 16 and 18**, report-only.\n\n'''
          new = '''## BU-SP1 payload comparison Batch 1 — COMPLETE\n\nReport `secondary-witnesses/bharathiar-university/comparisons/07-shower-of-poetry-vol-1-matched-batch-01.md`: confirmed MATCHED entries **1, 8, 9, 11, 12, 13, 14, 15, 16 and 18**, **PASS / REPORT-ONLY — 10/10**. Tamil/source correction candidates **0**; released-English correction candidates **0**; mutations **0 / 0**. Strong diagnostics include BU `பஞ்சைகளல்ல` → **cowards**, `கிந்தன்` → **Kandan**, omission of the New Path river-love sequence and Bharathidasan Muthamma dream, and Calculation-I `மணக்கணக்கு` → **mental calculation** / `வேங்கை` → **lion** / river → **rains**.\n\n## Exact next activity\n\nRun BU-SP1 payload-comparison Batch 2 for confirmed MATCHED entries **19, 21, 22, 23, 25, 26, 27, 28, 30 and 33**, report-only. Physical witness ranges extend through PDF page **182**, so direct-render the exact checksum-locked bytes beyond the normal 150-page renderer window.\n\n'''
          if old not in t:
              raise SystemExit('HANDOVER next block not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          # NEXT_CHAT_PROMPT — replace from current exact-next heading to EOF
          p = Path('NEXT_CHAT_PROMPT.md')
          t = p.read_text(encoding='utf-8')
          marker = '## Exact next activity — BU-SP1 payload comparison Batch 1\n'
          if marker not in t:
              raise SystemExit('NEXT prompt marker not found')
          prefix = t.split(marker, 1)[0]
          suffix = '''## BU-SP1 payload comparison Batch 1 — COMPLETE\n\nReport: `secondary-witnesses/bharathiar-university/comparisons/07-shower-of-poetry-vol-1-matched-batch-01.md`.\n\nScope: confirmed MATCHED entries **1, 8, 9, 11, 12, 13, 14, 15, 16 and 18**. Result: **PASS / REPORT-ONLY — 10/10**; Tamil/source corrections **0**; released-English corrections **0**; mutations **0 / 0**.\n\nStrong witness diagnostics:\n\n- entry 1: `பஞ்சைகளல்ல` → BU **cowards** instead of source **paupers**, plus an unsupported **tricks and frauds** insertion;\n- entry 8: BU flattens `Nalla Thambi / Panam / Manamagal` and reads source `கிந்தன்` as **Kandan**;\n- entry 13: BU omits the extended river-name love sequence;\n- entry 14: BU materially condenses the sea/rain/river/well/pond/tears/sweat architecture;\n- entry 15: BU omits the Muthusamy → Muthamma dream sequence;\n- entry 18: BU `மணக்கணக்கு` → **mental calculation**, `வேங்கை` → **lion**, and river multiplication → multiplying **rains**.\n\nThese are secondary-witness issues; the source-controlled repository remains unchanged.\n\n## Exact next activity — BU-SP1 payload comparison Batch 2\n\nCompare confirmed MATCHED entries **19, 21, 22, 23, 25, 26, 27, 28, 30 and 33** against their FINAL-CLEARED Tamil and RELEASE-CLEARED English targets.\n\nExact BU printed / physical PDF ranges:\n\n- entry 19: **90–95 / 114–119**;\n- entry 21: **98–104 / 122–128**;\n- entry 22: **105–110 / 129–134**;\n- entry 23: **111–115 / 135–139**;\n- entry 25: **118–125 / 142–149**;\n- entry 26: **126–130 / 150–154**;\n- entry 27: **131–132 / 155–156**;\n- entry 28: **133–141 / 157–165**;\n- entry 30: **146–147 / 170–171**;\n- entry 33: **156–158 / 180–182**.\n\nThe normal renderer may stop at 150 pages. For physical pages **150–182**, render directly from the same exact checksum-locked Volume-I PDF bytes; do not use OCR reconstruction. Classify title, semantics, omissions/condensation, expansion, transliteration/name choice and structure. Produce a durable report only; do not mutate Tamil or released English.\n'''
          p.write_text(prefix + suffix, encoding='utf-8')

          # phase plan
          p = Path('TRANSCRIPTION_PHASE_PLAN.md')
          t = p.read_text(encoding='utf-8')
          old = '''### Current comparison activity — NEXT\n\n**BU-SP1 payload-comparison Batch 1** — confirmed MATCHED entries **1, 8, 9, 11, 12, 13, 14, 15, 16, 18**. Report-only; no Tamil or released-English mutation.\n\n### Planned sequence after Batch 1\n\n1. continue BU-SP1 confirmed-MATCHED payload comparisons;\n2. investigate BU-SP1 remaining 30 unmapped entries;\n3. BU-SP3 — item-level matching for 50 INVESTIGATE entries;\n4. BU-SP2 — retain not-yet-represented entries until source-backed identities are established.\n'''
          new = '''### BU-SP1 payload-comparison Batch 1 — COMPLETE\n\nReport `comparisons/07-shower-of-poetry-vol-1-matched-batch-01.md`: entries **1, 8, 9, 11, 12, 13, 14, 15, 16 and 18**, **PASS / REPORT-ONLY — 10/10**. Tamil/source correction candidates **0**; released-English correction candidates **0**; mutations **0 / 0**.\n\n### Current comparison activity — NEXT\n\n**BU-SP1 payload-comparison Batch 2** — confirmed MATCHED entries **19, 21, 22, 23, 25, 26, 27, 28, 30 and 33**. Report-only. Exact witness physical pages extend to **182**; direct exact-byte rendering is required beyond the normal 150-page renderer window.\n\n### Planned sequence after Batch 2\n\n1. compare the final two confirmed BU-SP1 MATCHED entries **39 and 40**;\n2. investigate BU-SP1 remaining 30 unmapped entries;\n3. BU-SP3 — item-level matching for 50 INVESTIGATE entries;\n4. BU-SP2 — retain not-yet-represented entries until source-backed identities are established.\n'''
          if old not in t:
              raise SystemExit('PHASE current block not found')
          t = t.replace(old, new, 1)
          old2 = '## Exact next activity\n\nProceed with **BU-SP1 payload-comparison Batch 1 — entries 1, 8, 9, 11, 12, 13, 14, 15, 16 and 18 — report only**.\n'
          new2 = '## Exact next activity\n\nProceed with **BU-SP1 payload-comparison Batch 2 — entries 19, 21, 22, 23, 25, 26, 27, 28, 30 and 33 — report only**.\n'
          if old2 not in t:
              raise SystemExit('PHASE exact-next block not found')
          p.write_text(t.replace(old2, new2, 1), encoding='utf-8')

      - name: Commit synchronized records
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secondary-witnesses/bharathiar-university/README.md \
                  secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md \
                  HANDOVER.md NEXT_CHAT_PROMPT.md TRANSCRIPTION_PHASE_PLAN.md
          git commit -m 'Close BU-SP1 payload comparison Batch 1 [skip ci]'
          git push
