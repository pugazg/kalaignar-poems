name: Run BU-SP3 Batch 5 sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-sync-bu-sp3-batch4.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize BU-SP3 Batch 5 durable state
        run: python .github/scripts/sync_bu_sp3_batch4_state.py
      - name: Commit synchronized state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md HANDOVER.md NEXT_CHAT_PROMPT.md TRANSCRIPTION_PHASE_PLAN.md \
            secondary-witnesses/bharathiar-university/README.md \
            secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md \
            secondary-witnesses/bharathiar-university/shower-of-poetry-vol-3/source.md \
            secondary-witnesses/bharathiar-university/shower-of-poetry-vol-3/crosswalk.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Synchronize BU-SP3 identity Batch 5 closure"
            git push
          fi
