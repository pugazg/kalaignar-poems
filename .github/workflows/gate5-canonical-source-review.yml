name: Gate5 Canonical Source Review

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gate5-canonical-source-review.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply structural-page pagination rule to validator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/gate5_review.py')
          s = p.read_text(encoding='utf-8')
          old = '    expected_printed = compact_ranges([n - 17 for n in expected_scans])\n'
          new = '    printed_basis = [n for n in expected_scans if records[n][0].get("page_type") not in {"section-divider", "verso"}]\n    expected_printed = compact_ranges([n - 17 for n in printed_basis])\n'
          if old not in s:
              raise SystemExit('expected validator line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run Gate 5 review
        run: python3 .github/gate5_review.py
      - name: Validate Gate 5 report
        run: |
          grep -q 'COMPLETE — PASS' poems/kalaignarin-kavithaigal/PHASE3_CANONICAL_SOURCE_REVIEW.md
          grep -q '77/77 — PASS' poems/kalaignarin-kavithaigal/PHASE3_CANONICAL_SOURCE_REVIEW.md
          grep -q '447/447 — PASS' poems/kalaignarin-kavithaigal/PHASE3_CANONICAL_SOURCE_REVIEW.md
          grep -Fq 'unresolved source-completeness defects: **0**' poems/kalaignarin-kavithaigal/PHASE3_CANONICAL_SOURCE_REVIEW.md
      - name: Commit Gate 5 review and remove one-shot runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/gate5_review.py .github/workflows/gate5-canonical-source-review.yml
          git add -A
          git diff --cached --check
          git commit -m "Complete Kalaignarin Kavithaigal Phase 3 Gate 5 review"
          git push origin HEAD:main
