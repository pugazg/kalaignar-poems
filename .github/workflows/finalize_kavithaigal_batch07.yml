name: Finalize Kalaignarin Kavithaigal Batch 07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize_kavithaigal_batch07.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply guarded Batch 07 finalization
        run: python .github/scripts/finalize_kavithaigal_batch07.py
      - name: Enforce Tamil-layer scope guard
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^poems/kalaignarin-kavithaigal/(pages|sections)/'; then
            echo 'ERROR: Tamil pages/sections changed during Phase 4 Batch 07 finalization.' >&2
            exit 1
          fi
          test ! -e .github/scripts/finalize_kavithaigal_batch07.py
          test ! -e .github/workflows/finalize_kavithaigal_batch07.yml
      - name: Commit synchronized durable state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize Kalaignarin Kavithaigal Phase 4 Batch 07'
          git push
