name: Phase4 Batch03 Status Sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase4-batch03-status-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize Phase 4 Batch 03 durable status
        run: python3 .github/phase4_batch03_status_sync.py
      - name: Validate Phase 4 Batch 03 scope
        run: |
          test -z "$(git diff --name-only | grep -E '^poems/kalaignarin-kavithaigal/(pages|sections)/' || true)"
          grep -q 'Batches 01–03 reviewed PASS' HANDOVER.md
          grep -q 'Batch 04' HANDOVER.md
          grep -q 'Batches 01–03 reviewed PASS' NEXT_CHAT_PROMPT.md
          grep -q 'Batch 04' NEXT_CHAT_PROMPT.md
          grep -q 'Batches 01–03 reviewed PASS' README.md
          grep -q '5/77' poems/kalaignarin-kavithaigal/audit.md
          grep -q '50/439' poems/kalaignarin-kavithaigal/indexes/page-map.md
          grep -q 'Batch 04' poems/kalaignarin-kavithaigal/metadata/source.md
          test -f poems/kalaignarin-kavithaigal/translations/en/batches/batch-03.md
          grep -q 'status: "batch-reviewed"' poems/kalaignarin-kavithaigal/translations/en/items/04-hiranyan-en.md
          grep -q 'status: "batch-reviewed"' poems/kalaignarin-kavithaigal/translations/en/items/05-king-vali-en.md
      - name: Commit synchronization and remove one-shot runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/phase4_batch03_status_sync.py .github/workflows/phase4-batch03-status-sync.yml
          git add -A
          git diff --cached --check
          git commit -m "Synchronize Kalaignarin Kavithaigal Phase 4 Batch 03 status"
          git push origin HEAD:main
