name: fix-kavithaigal-batch03-pointer
on:
  push:
    paths:
      - '.github/workflows/fix-kavithaigal-batch03-pointer.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct historical Batch 03 review pointer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('HANDOVER.md')
          s=p.read_text(encoding='utf-8')
          old='- Batch-03 review: `translations/en/batches/batch-04.md`;'
          new='- Batch-03 review: `translations/en/batches/batch-03.md`;'
          if old not in s:
              raise SystemExit('expected incorrect historical pointer not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm -f .github/workflows/fix-kavithaigal-batch03-pointer.yml
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct Kalaignarin Kavithaigal Batch 03 handover pointer'
          git push
