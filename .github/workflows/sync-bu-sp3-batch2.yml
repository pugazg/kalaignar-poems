## Exact next activity

Proceed to **BU-SP3 Identity Investigation Batch 2 — entries 11–20**. Harden identities only from actual Volume-III payload/event/source context and current repository inventories; report/crosswalk only.'''
          new = '''## BU-SP3 identity investigation Batch 1 — COMPLETE

Report: `comparisons/13-shower-of-poetry-vol-3-identity-investigation-batch-01.md`. Entries **1–10** → **NOT YET REPRESENTED** after direct page-image/payload review; no MATCHED or unresolved rows in the batch. Tamil / released-English mutations: **0 / 0**.

## BU-SP3 identity investigation Batch 2 — COMPLETE

Report: `comparisons/14-shower-of-poetry-vol-3-identity-investigation-batch-02.md`. Entries **11–20** → **NOT YET REPRESENTED** after direct page-image/payload review; no MATCHED or unresolved rows in the batch. Current BU-SP3 state: **0 MATCHED / 0 POSSIBLE / 20 NOT YET REPRESENTED / 30 INVESTIGATE = 50**. Current four-book tally: **68 MATCHED / 0 POSSIBLE / 78 NOT YET REPRESENTED / 30 INVESTIGATE = 176**. Tamil / released-English mutations: **0 / 0**.

## Exact next activity

Proceed to **BU-SP3 Identity Investigation Batch 3 — entries 21–30**. Harden identities only from actual Volume-III payload/event/source context and current repository inventories; report/crosswalk only.'''
          t = replace_once(t, old, new, 'master Batch 2 tail')
          write(p, t)

          # Root handover.
          p = 'HANDOVER.md'
          t = read(p)
          t = replace_some(t, '68 MATCHED / 0 POSSIBLE / 58 NOT YET REPRESENTED / 50 INVESTIGATE', '68 MATCHED / 0 POSSIBLE / 78 NOT YET REPRESENTED / 30 INVESTIGATE', 'handover stale aggregate')
          t = replace_some(t, '68 MATCHED / 0 POSSIBLE / 68 NOT YET REPRESENTED / 40 INVESTIGATE', '68 MATCHED / 0 POSSIBLE / 78 NOT YET REPRESENTED / 30 INVESTIGATE', 'handover Batch1 aggregate')
          old = '''## BU-SP3 identity investigation Batch 1 — COMPLETE

Report: `secondary-witnesses/bharathiar-university/comparisons/13-shower-of-poetry-vol-3-identity-investigation-batch-01.md`. Entries **1–10** were hardened **NOT YET REPRESENTED** from direct physical pages **27–59** / printed pages **1–33**. Batch result: **PASS / REPORT-ONLY — 10/10; 0 MATCHED / 10 NOT YET REPRESENTED / 0 unresolved**. BU-SP3 now stands at **0 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 40 INVESTIGATE = 50**; four-book tally **68 MATCHED / 0 POSSIBLE / 78 NOT YET REPRESENTED / 30 INVESTIGATE = 176**. Tamil / released-English mutations: **0 / 0**.

## Exact next activity

