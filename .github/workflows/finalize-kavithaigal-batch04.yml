name: finalize-kavithaigal-batch04
on:
  push:
    paths:
      - '.github/workflows/finalize-kavithaigal-batch04.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize Batch 04
        run: python .github/scripts/finalize_kavithaigal_batch04.py
      - name: Remove one-shot runner
        run: rm -f .github/scripts/finalize_kavithaigal_batch04.py .github/workflows/finalize-kavithaigal-batch04.yml
      - name: Commit synchronized state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Synchronize Kalaignarin Kavithaigal Phase 4 Batch 04 status'
          git push
