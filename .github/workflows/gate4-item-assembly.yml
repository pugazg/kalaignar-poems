name: Gate4 Item Assembly Correction

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gate4-item-assembly.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate corrected anthology item assembly
        run: python3 .github/gate4_item_assembly.py
      - name: Validate corrected structure
        run: |
          test "$(find poems/kalaignarin-kavithaigal/sections -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')" = "77"
          test ! -e poems/kalaignarin-kavithaigal/sections/kalaignarin-kavithaigal.md
          grep -q '77/77' poems/kalaignarin-kavithaigal/PHASE3_CANONICAL_ASSEMBLY.md
          grep -q '439/439' poems/kalaignarin-kavithaigal/indexes/canonical-source-map.md
      - name: Commit corrected Gate 4 outputs and remove one-shot runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/gate4_item_assembly.py .github/workflows/gate4-item-assembly.yml
          git add -A
          git diff --cached --check
          git commit -m "Correct Kalaignarin Kavithaigal anthology Gate 4 assembly"
          git push origin HEAD:main

# Temporary one-shot runner; it removes itself in the generated correction commit.
