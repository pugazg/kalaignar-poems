name: Probe TDL BU-SP3 download

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-tdl-bu-sp3.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe page source for BU-SP3 file URLs
        shell: python
        run: |
          import re, requests
          from urllib.parse import unquote
          url='https://tamildigitallibrary.in/Articles/%E0%AE%A8%E0%AF%82%E0%AE%B2%E0%AF%8D-65524-Shower%20of%20poetry'
          r=requests.get(url,timeout=30)
          print('status',r.status_code,'len',len(r.text),'final',r.url)
          text=r.text
          for pat in ['TVA_BOK_0065524','65524','pdf','download','filePath','document']:
              print('\nPATTERN',pat)
              for m in list(re.finditer(pat,text,re.I))[:20]:
                  s=max(0,m.start()-500); e=min(len(text),m.end()+1000)
                  print(unquote(text[s:e]).replace('\n',' ')[:1800])
          urls=sorted(set(re.findall(r'https?://[^\"\'<> ]+', text)))
          print('\nURLS')
          for u in urls:
              if 'pdf' in u.lower() or 'book' in u.lower() or 'download' in u.lower() or '65524' in u:
                  print(unquote(u))
