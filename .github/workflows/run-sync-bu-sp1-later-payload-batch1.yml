name: Run BU-SP1 later payload Batch 1 sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-sync-bu-sp1-later-payload-batch1.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize BU-SP1 later payload Batch 1 durable state
        run: python .github/scripts/sync_bu_sp1_later_payload_batch1.py
      - name: Commit synchronized state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md HANDOVER.md TRANSCRIPTION_PHASE_PLAN.md NEXT_CHAT_PROMPT.md \
            secondary-witnesses/bharathiar-university/README.md \
            secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md \
            secondary-witnesses/bharathiar-university/shower-of-poetry-vol-1/crosswalk.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Synchronize BU-SP1 later payload Batch 1 state"
            git push
          fi
