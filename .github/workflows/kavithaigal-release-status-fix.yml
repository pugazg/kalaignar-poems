name: Fix Kalaignarin Kavithaigal release status

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run Kalaignarin Kavithaigal release status fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct translation-plan status and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          workflow='.github/workflows/kavithaigal-release-status-fix.yml'
          plan='poems/kalaignarin-kavithaigal/translations/en/TRANSLATION_PLAN.md'
          p=Path(plan)
          t=p.read_text()
          old='**PHASE 4 ITEM TRANSLATION REVIEW COMPLETE — Batches 01–18 reviewed PASS.**'
          new='**PHASE 4 COMPLETE — Batches 01–18 reviewed PASS; full English collection RELEASE-CLEARED.**'
          if old not in t:
              raise SystemExit('status target missing')
          p.write_text(t.replace(old,new,1))
          Path(workflow).unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','-A'],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if sorted(changed) != sorted([workflow,plan]):
              raise SystemExit(f'unexpected staged files: {changed}')
          subprocess.run(['git','commit','-m','Correct Kalaignarin Kavithaigal release status'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
