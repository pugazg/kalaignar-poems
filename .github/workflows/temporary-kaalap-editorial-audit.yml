name: Temporary Kaalap English Editorial Audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-kaalap-editorial-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit assembled English collection against reviewed batches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib
          import re

          root = Path('poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en')
          assembled_path = root / 'kaalap-pezhaiyum-kavithai-saaviyum-en.md'
          assembled = assembled_path.read_text(encoding='utf-8')

          batch_item_re = re.compile(
              r'^## Item (\d+) — (.*?)\n\n'
              r'Source metadata:\n\n'
              r'(.*?)\n\n'
              r'^### English translation\n\n'
              r'(.*?)'
              r'(?=^## Item \d+ — |^## Translator notes)',
              re.MULTILINE | re.DOTALL,
          )
          assembled_item_re = re.compile(
              r'^## Item (\d+) — (.*?)\n\n'
              r'(.*?)'
              r'(?=^## Item \d+ — |\Z)',
              re.MULTILINE | re.DOTALL,
          )

          batch_items = []
          batch_meta = {}
          for batch_no in range(1, 22):
              path = root / 'batches' / f'batch-{batch_no:02d}.md'
              text = path.read_text(encoding='utf-8')
              for num, title, meta, body in batch_item_re.findall(text):
                  n = int(num)
                  batch_items.append((n, title.strip(), body.rstrip()))
                  batch_meta[n] = meta

          assembled_items = [
              (int(num), title.strip(), body.rstrip())
              for num, title, body in assembled_item_re.findall(assembled)
          ]

          expected_numbers = list(range(1, 59))
          batch_numbers = [n for n, _, _ in batch_items]
          assembled_numbers = [n for n, _, _ in assembled_items]

          checks = []
          def check(label, ok, detail=''):
              checks.append((label, bool(ok), detail))

          check('Reviewed batches parse to items 1–58 exactly once and in order', batch_numbers == expected_numbers, str(batch_numbers))
          check('Assembled collection contains items 1–58 exactly once and in order', assembled_numbers == expected_numbers, str(assembled_numbers))

          batch_by_num = {n: (title, body) for n, title, body in batch_items}
          assembled_by_num = {n: (title, body) for n, title, body in assembled_items}
          mismatches = []
          for n in expected_numbers:
              if batch_by_num.get(n) != assembled_by_num.get(n):
                  mismatches.append(n)
          check('Every assembled title/body is byte-for-byte identical to its reviewed batch title/body', not mismatches, f'mismatched items: {mismatches}')

          scan_markers = [int(x) for x in re.findall(r'<!-- scan (\d+) -->', assembled)]
          expected_scans = list(range(10, 300))
          check('Scan provenance markers cover 10–299 exactly once and in order', scan_markers == expected_scans, f'count={len(scan_markers)} first={scan_markers[:3]} last={scan_markers[-3:]}')

          forbidden = ['Source metadata:', '## Translator notes', '## Batch review', 'translation_basis:', 'title-witness status:']
          leaked = [x for x in forbidden if x in assembled]
          check('Batch metadata/review prose does not leak into reader-facing collection', not leaked, f'leaked markers: {leaked}')

          check('Collection closes exactly at verified Item 58 boundary', assembled.rstrip().endswith('(First Part Complete)'), assembled.rstrip()[-120:])
          check('First Part Complete occurs exactly once', assembled.count('(First Part Complete)') == 1, f"count={assembled.count('(First Part Complete)')}")

          discrepancy_items = [18,22,25,26,29,31,32,37,40,44,46,50,54,58]
          missing_discrepancy_metadata = []
          for n in discrepancy_items:
              meta = batch_meta.get(n, '')
              needed = ['canonical Tamil title:', 'contents witness:', 'title-witness status: **documented']
              if not all(x in meta for x in needed):
                  missing_discrepancy_metadata.append(n)
          check('All 14 title-witness discrepancy items retain canonical/contents/status metadata in reviewed batches', not missing_discrepancy_metadata, f'missing: {missing_discrepancy_metadata}')

          item37_meta = batch_meta.get(37, '')
          check('Item 37 stable identity / printed-number anomaly remains documented', 'printed item number on title page: **36**' in item37_meta and 'stable item: **37**' in item37_meta, '')

          star_forms = Counter(re.findall(r'(?m)^(★(?:\s+★){0,2})$', assembled))
          note_count = assembled.count('**Note:**')
          parenthetical_note_markers = sum(1 for line in assembled.splitlines() if line.startswith('(Based upon ') or line.startswith('(The collection of ideas') or line.startswith('(Vide his '))

          variant_groups = {
              'Muttamil family': ['Muttamil', 'Muthamil', 'Muthamizh', 'Muttamizh'],
              'Kaveri/Cauvery': ['Kaveri', 'Cauvery'],
              'Tolkappiyam variants': ['Tolkappiyam', 'Tolkāppiyam', 'Tholkappiyam'],
              'Silappathikaram variants': ['Silappathikaram', 'Silappadikaram', 'Silapathikaram'],
              'Purananuru variants': ['Purananuru', 'Purananūru'],
              'Akananuru variants': ['Akananuru', 'Akananūru'],
              'Nedunalvadai variants': ['Nedunalvadai', 'Nedunalvaadai'],
              'Maduraikanchi variants': ['Maduraikanchi', 'Madurai Kanchi'],
              'vadakkiruthal variants': ['vadakkiruthal', 'vadakiruthal'],
              'kudavolai variants': ['kudavolai', 'kudavolai'],
          }
          variant_rows = []
          for label, variants in variant_groups.items():
              counts = [(v, len(re.findall(re.escape(v), assembled, flags=re.IGNORECASE))) for v in variants]
              variant_rows.append((label, counts))

          headings = [(n, title) for n, title, _ in assembled_items]
          sha256 = hashlib.sha256(assembled.encode('utf-8')).hexdigest()

          lines = []
          lines.append('# Temporary full-work English editorial diagnostics')
          lines.append('')
          lines.append(f'- assembled file: `{assembled_path}`')
          lines.append(f'- bytes: **{len(assembled.encode("utf-8"))}**')
          lines.append(f'- lines: **{len(assembled.splitlines())}**')
          lines.append(f'- SHA-256: `{sha256}`')
          lines.append('')
          lines.append('## Structural and provenance checks')
          lines.append('')
          for label, ok, detail in checks:
              lines.append(f'- **{"PASS" if ok else "FAIL"}** — {label}' + (f' — {detail}' if detail else ''))
          lines.append('')
          lines.append('## Source-visible structure inventory')
          lines.append('')
          lines.append(f'- scan comments: **{len(scan_markers)}**')
          lines.append(f'- `**Note:**` blocks: **{note_count}**')
          lines.append(f'- selected parenthetical source-note openings: **{parenthetical_note_markers}**')
          for form, count in sorted(star_forms.items()):
              lines.append(f'- separator `{form}`: **{count}**')
          lines.append('')
          lines.append('## Recurring-term variant inventory')
          lines.append('')
          for label, counts in variant_rows:
              rendered = '; '.join(f'`{v}`={c}' for v, c in counts)
              lines.append(f'- {label}: {rendered}')
          lines.append('')
          lines.append('## Reader-facing item headings')
          lines.append('')
          for n, title in headings:
              lines.append(f'{n}. {title}')
          lines.append('')

          out = Path('.github/kaalap-editorial-diagnostics.md')
          out.write_text('\n'.join(lines), encoding='utf-8')
          print(out.read_text(encoding='utf-8'))

          failures = [label for label, ok, _ in checks if not ok]
          if failures:
              raise SystemExit('Audit failures: ' + '; '.join(failures))
          PY

      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/kaalap-editorial-diagnostics.md
          git commit -m "Generate full-work English editorial diagnostics"
          git push origin HEAD:main
