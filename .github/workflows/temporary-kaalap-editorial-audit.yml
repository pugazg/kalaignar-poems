name: Temporary Kaalap English Editorial Audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-kaalap-editorial-audit.yml

permissions:
  contents: write

jobs:
  sync-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Advance Phase 4 status ledgers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en')

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected status text: {label}')
              return text.replace(old, new, 1)

          def replace_tail(text, lines):
              marker = '## Exact next activity\n'
              if marker not in text:
                  raise SystemExit('Missing Exact next activity section')
              prefix = text[:text.index(marker)]
              return prefix + '\n'.join(lines).rstrip() + '\n'

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text = must_replace(
              text,
              'Status: **PHASE 4 IN PROGRESS — translation batching COMPLETE; complete English collection assembly COMPLETE; full-work editorial consistency review NEXT**',
              'Status: **PHASE 4 IN PROGRESS — translation batching COMPLETE; complete English collection assembly COMPLETE; full-work editorial consistency review COMPLETE — PASS; source-coverage/release review NEXT**',
              'README status',
          )
          text = text.replace('Peruvaluthi', 'Peruvazhuthi')
          text = must_replace(
              text,
              '4. perform full-work editorial/terminology/voice consistency review — **NEXT**;',
              '4. perform full-work editorial/terminology/voice consistency review — **COMPLETE — PASS**;',
              'README editorial gate',
          )
          text = must_replace(
              text,
              '5. perform source-coverage/release review;',
              '5. perform source-coverage/release review — **NEXT**;',
              'README release gate',
          )
          text = replace_tail(text, [
              '## Exact next activity',
              '',
              'Perform the final **source-coverage / release review** of `kaalap-pezhaiyum-kavithai-saaviyum-en.md` against the reviewed batches and `SOURCE_MAP.md`.',
              '',
              'Verify complete items **1–58** / scans **10–299**, title-witness traceability, all required source-visible notes/quotations/separators, absence of batch/editorial apparatus, synchronization of the editorial corrections recorded in `EDITORIAL_CONSISTENCY_REVIEW.md`, protection of the Tamil canonical/page layer, and the verified item-58 stop before scan-300 end matter.',
              '',
              'Create `RELEASE_REPORT.md` only if this final release gate passes.',
          ])
          readme.write_text(text, encoding='utf-8')

          plan = root / 'TRANSLATION_PLAN.md'
          text = plan.read_text(encoding='utf-8')
          text = must_replace(
              text,
              '**PHASE 4 IN PROGRESS — Batches 01–21 reviewed PASS; translation batching COMPLETE; complete English collection assembly COMPLETE; editorial consistency review NEXT.**',
              '**PHASE 4 IN PROGRESS — Batches 01–21 reviewed PASS; translation batching COMPLETE; complete English collection assembly COMPLETE; editorial consistency review COMPLETE — PASS; source-coverage/release review NEXT.**',
              'plan status',
          )
          text = text.replace('Peruvaluthi', 'Peruvazhuthi')
          text = must_replace(
              text,
              '3. run `EDITORIAL_CONSISTENCY_REVIEW.md` across names, titles, terminology, punctuation, dialogue, literary references and recurring rhetorical patterns — **NEXT**;',
              '3. run `EDITORIAL_CONSISTENCY_REVIEW.md` across names, titles, terminology, punctuation, dialogue, literary references and recurring rhetorical patterns — **COMPLETE — PASS**;',
              'plan editorial gate',
          )
          text = must_replace(
              text,
              '4. verify all title-witness metadata remains traceable;',
              '4. verify all title-witness metadata remains traceable — **PASS at editorial gate**;',
              'plan title gate',
          )
          text = must_replace(
              text,
              '5. ensure translator notes/review prose do not leak into verse unless deliberately designated;',
              '5. ensure translator notes/review prose do not leak into verse unless deliberately designated — **PASS at editorial gate**;',
              'plan apparatus gate',
          )
          text = must_replace(
              text,
              '6. run complete source-coverage and Kalaignar-voice review;',
              '6. run complete source-coverage / final release review — **NEXT**;',
              'plan final review gate',
          )
          text = replace_tail(text, [
              '## Exact next activity',
              '',
              'Perform the final **source-coverage / release review** of the complete assembled English work.',
              '',
              'Use the reviewed batches, `SOURCE_MAP.md` and `EDITORIAL_CONSISTENCY_REVIEW.md` to verify items **1–58**, scans **10–299**, title-witness traceability, item-internal notes and source-visible structure, final English/batch synchronization, and the scan-299 closing boundary. Do not alter the Tamil canonical/page layer and do not use outside knowledge to repair source claims.',
              '',
              'Create `RELEASE_REPORT.md` only if every final release check passes.',
          ])
          plan.write_text(text, encoding='utf-8')

          source_map = root / 'SOURCE_MAP.md'
          text = source_map.read_text(encoding='utf-8')
          text = text.replace('Peruvaluthi', 'Peruvazhuthi')
          anchor = '- reader-facing collection assembly: **COMPLETE — 58/58 items exactly once and in order**.'
          if anchor not in text:
              raise SystemExit('Missing source-map progress anchor')
          if '- full-work editorial consistency review:' not in text:
              text = text.replace(
                  anchor,
                  anchor + '\n- full-work editorial consistency review: **COMPLETE — PASS**; unresolved editorial issues: **0**.',
                  1,
              )
          text = replace_tail(text, [
              '## Exact next activity',
              '',
              'Perform the final **source-coverage / release review** of `kaalap-pezhaiyum-kavithai-saaviyum-en.md` against this source map and the reviewed batch records.',
              '',
              'Confirm complete items **1–58** / scans **10–299**, all source-sensitive flags and item-internal notes, all 14 title-witness decisions, the absence of batch/editorial apparatus, synchronization with `EDITORIAL_CONSISTENCY_REVIEW.md`, no Tamil-layer modification, and the verified item-58 end before scan-300 material.',
              '',
              'Create `RELEASE_REPORT.md` only after this final gate passes.',
          ])
          source_map.write_text(text, encoding='utf-8')

          print('Phase-4 status ledgers advanced to final source-coverage/release review.')
          PY

      - name: Commit synchronized status ledgers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/README.md
          git add poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/TRANSLATION_PLAN.md
          git add poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/SOURCE_MAP.md
          git commit -m "Advance English translation to final release review"
          git push origin HEAD:main
