name: Batch05 Finalize
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch05-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize and validate Batch 05
        run: python scripts/batch05_finalize.py
      - name: Validate diff
        run: |
          git diff --check
          if git diff --name-only c76fe94d3e982572bbc5cbda9e3a27fdc96d9183 | grep -E '^poems/kalaignarin-kavithaigal/(pages|sections)/'; then
            echo 'Tamil pages/sections changed' >&2
            exit 1
          fi
      - name: Commit durable Batch 05 state and remove one-shot runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Kalaignarin Kavithaigal Phase 4 Batch 05'
          git push
