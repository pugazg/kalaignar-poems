name: Close BU-SP1 Batch 2 sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/close-sp1-batch2-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update durable status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_to_eof(path, marker, replacement):
              p = Path(path)
              t = p.read_text(encoding='utf-8')
              assert marker in t, (path, marker)
              p.write_text(t.split(marker, 1)[0] + replacement, encoding='utf-8')

          def replace_section(path, start, next_heading, replacement):
              p = Path(path)
              t = p.read_text(encoding='utf-8')
              i = t.index(start)
              j = t.index(next_heading, i + len(start))
              p.write_text(t[:i] + replacement + t[j:], encoding='utf-8')

          # secondary witness README: current Next activity is final section.
          replace_to_eof(
              'secondary-witnesses/bharathiar-university/README.md',
              '## Next activity\n',
              '''### BU-SP1 payload comparison Batch 2 — COMPLETE\n\nReport: `comparisons/08-shower-of-poetry-vol-1-matched-batch-02.md`.\n\nCompared confirmed MATCHED entries **19, 21, 22, 23, 25, 26, 27, 28, 30 and 33** against FINAL-CLEARED Tamil and RELEASE-CLEARED English. Result: **PASS / REPORT-ONLY — 10/10**; Tamil/source correction candidates **0**; released-English correction candidates **0**; mutations **0 / 0**.\n\nHigh-value diagnostics: BU entry 19 omits the long Nehru/Rose flower-garden allegory; entry 21 mistranslates source `பொன்விழா` as **Diamond Jubilee** and carries an impossible **10-08-1922** Silver-Jubilee footnote date; entry 25 heavily condenses the Silappathikaram/Tolkappiyam/abhinaya architecture; entry 26 mistranslates `ஆத்திகம்` as **agnosticism** and omits the Kamban/Ravana plus Anna-work-title chain; entry 28 gives **07-11-1980** where the controlling Tamil opening is **7.1.80**. These are secondary-witness defects/condensations, not repository defects.\n\n## Next activity\n\nRun the **final confirmed-MATCHED BU-SP1 payload batch** for entries **39 and 40** — entry 39 **Rationalist, Pandyan** → `kalaignarin-kavithaigal` item 48; entry 40 **No Day there is That May be his Birthday Called** → item 46. Then create a consolidated **22/22 confirmed-MATCHED BU-SP1 comparison summary**. Report only.\n''')

          replace_to_eof(
              'secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md',
              '## Exact next activity\n',
              '''## BU-SP1 payload comparison Batch 2 — COMPLETE\n\n`comparisons/08-shower-of-poetry-vol-1-matched-batch-02.md` compares confirmed MATCHED entries **19, 21, 22, 23, 25, 26, 27, 28, 30 and 33**. Result: **PASS / REPORT-ONLY — 10/10**, Tamil/source correction candidates **0**, released-English correction candidates **0**, mutations **0 / 0**. Strong diagnostics include omission of the Nehru/Rose allegory; `பொன்விழா` → **Diamond Jubilee** plus the BU 1922 date error; heavy Silappathikaram/Tolkappiyam condensation; `ஆத்திகம்` → **agnosticism**; and BU **07-11-1980** versus source **7.1.80**.\n\n## Exact next activity\n\nCompare the final two confirmed BU-SP1 MATCHED payloads: **39 and 40**. Then produce a consolidated **22/22 confirmed-MATCHED BU-SP1 comparison summary** before investigating the remaining 30 Volume-I rows.\n''')

          replace_section(
              'HANDOVER.md',
              '## Exact next activity\n',
              '## Release-cleared work rule\n',
              '''## BU-SP1 payload comparison Batch 2 — COMPLETE\n\nReport `secondary-witnesses/bharathiar-university/comparisons/08-shower-of-poetry-vol-1-matched-batch-02.md`: entries **19, 21, 22, 23, 25, 26, 27, 28, 30 and 33**, **PASS / REPORT-ONLY — 10/10**. Tamil/source correction candidates **0**; released-English correction candidates **0**; mutations **0 / 0**. Exact-byte direct rendering was used for physical Volume-I pages beyond the normal 150-page renderer window; no OCR reconstruction.\n\nKey diagnostics: entry 19 omits the Nehru/Rose allegory; entry 21 has `பொன்விழா` → **Diamond Jubilee** plus a BU **1922** metadata error; entry 25 heavily condenses the Silappathikaram/Tolkappiyam/abhinaya blocks; entry 26 has `ஆத்திகம்` → **agnosticism** and omits the Kamban/Ravana + Anna-title chain; entry 28 has BU **07-11-1980** against source **7.1.80**.\n\n## Exact next activity\n\nRun the final confirmed-MATCHED BU-SP1 payload comparison for entries **39 and 40** (`Rationalist, Pandyan` → item 48; `No Day there is That May be his Birthday Called` → item 46), then create a consolidated **22/22 confirmed-MATCHED Volume-I summary**. Report-only.\n\n''')

          replace_to_eof(
              'NEXT_CHAT_PROMPT.md',
              '## Exact next activity — BU-SP1 payload comparison Batch 2\n',
              '''## BU-SP1 payload comparison Batch 2 — COMPLETE\n\nReport: `secondary-witnesses/bharathiar-university/comparisons/08-shower-of-poetry-vol-1-matched-batch-02.md`.\n\nScope: confirmed MATCHED entries **19, 21, 22, 23, 25, 26, 27, 28, 30 and 33**. Result: **PASS / REPORT-ONLY — 10/10**; Tamil/source correction candidates **0**; released-English correction candidates **0**; mutations **0 / 0**.\n\nStrong witness diagnostics:\n\n- entry 19 — BU omits the long Nehru/Rose flower-garden allegory;\n- entry 21 — source `பொன்விழா` becomes BU **Diamond Jubilee**, and the BU footnote gives an impossible Silver-Jubilee date **10-08-1922** instead of the source-controlled 1972 event;\n- entry 25 — BU heavily condenses the Poompuhar / Silappathikaram / Tolkappiyam / eight-meyppadu / abhinaya architecture;\n- entry 26 — BU translates `ஆத்திகம்` as **agnosticism** instead of theism and omits the Kamban/Ravana interrogation plus the Anna-work-title chain;\n- entry 28 — BU footnote **07-11-1980** conflicts with controlling Tamil opening **7.1.80**;\n- remaining differences are predominantly condensation, title interpretation, honorific normalization and loss of Tamil sound-play.\n\nThe source-controlled repository remains unchanged.\n\n## Exact next activity — final BU-SP1 confirmed-MATCHED payload batch\n\nCompare the final two confirmed MATCHED Volume-I entries:\n\n1. entry **39 — Rationalist, Pandyan** → `poems/kalaignarin-kavithaigal/` item **48**;\n2. entry **40 — No Day there is That May be his Birthday Called** → item **46**.\n\nInspect their exact BU payloads against FINAL-CLEARED Tamil and RELEASE-CLEARED English. Classify title, semantics, omissions/condensation, expansion, transliteration/name choice, structure and possible mistranslation. Produce a report only; do not mutate Tamil or released English.\n\nAfter those two are complete, create a consolidated **22/22 confirmed-MATCHED BU-SP1 comparison summary**, then proceed to identity investigation of the remaining **30 INVESTIGATE** Volume-I entries.\n''')

          p = Path('TRANSCRIPTION_PHASE_PLAN.md')
          t = p.read_text(encoding='utf-8')
          old = '''### Current comparison activity — NEXT\n\n**BU-SP1 payload-comparison Batch 2** — confirmed MATCHED entries **19, 21, 22, 23, 25, 26, 27, 28, 30 and 33**. Report-only. Exact witness physical pages extend to **182**; direct exact-byte rendering is required beyond the normal 150-page renderer window.\n\n### Planned sequence after Batch 2\n\n1. compare the final two confirmed BU-SP1 MATCHED entries **39 and 40**;\n2. investigate BU-SP1 remaining 30 unmapped entries;\n3. BU-SP3 — item-level matching for 50 INVESTIGATE entries;\n4. BU-SP2 — retain not-yet-represented entries until source-backed identities are established.\n'''
          new = '''### BU-SP1 payload-comparison Batch 2 — COMPLETE\n\nReport `comparisons/08-shower-of-poetry-vol-1-matched-batch-02.md`: entries **19, 21, 22, 23, 25, 26, 27, 28, 30 and 33**, **PASS / REPORT-ONLY — 10/10**. Tamil/source correction candidates **0**; released-English correction candidates **0**; mutations **0 / 0**.\n\n### Current comparison activity — NEXT\n\n**Final BU-SP1 confirmed-MATCHED payload batch** — entries **39 and 40**, mapped to repository items **48 and 46**. Report-only. After those two, create the consolidated **22/22 confirmed-MATCHED BU-SP1 comparison summary**.\n\n### Planned sequence after confirmed-MATCHED closure\n\n1. investigate BU-SP1 remaining 30 unmapped / INVESTIGATE entries;\n2. BU-SP3 — item-level matching for 50 INVESTIGATE entries;\n3. BU-SP2 — retain not-yet-represented entries until source-backed identities are established.\n'''
          assert old in t
          t = t.replace(old, new, 1)
          old2 = '## Exact next activity\n\nProceed with **BU-SP1 payload-comparison Batch 2 — entries 19, 21, 22, 23, 25, 26, 27, 28, 30 and 33 — report only**.\n'
          new2 = '## Exact next activity\n\nProceed with the **final BU-SP1 confirmed-MATCHED payload batch — entries 39 and 40 — report only**, then create the consolidated **22/22 Volume-I confirmed-MATCHED comparison summary**.\n'
          assert old2 in t
          p.write_text(t.replace(old2, new2, 1), encoding='utf-8')
          PY
      - name: Commit synchronized records
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secondary-witnesses/bharathiar-university/README.md secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md HANDOVER.md NEXT_CHAT_PROMPT.md TRANSCRIPTION_PHASE_PLAN.md
          git commit -m 'Close BU-SP1 payload comparison Batch 2 [skip ci]'
          git push
