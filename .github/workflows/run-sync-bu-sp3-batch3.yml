name: Run BU-SP3 Batch 3 sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-sync-bu-sp3-batch3.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize BU-SP3 Batch 3 durable state
        run: python .github/scripts/sync_bu_sp3_batch3.py
      - name: Commit synchronized state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOVER.md TRANSCRIPTION_PHASE_PLAN.md secondary-witnesses/bharathiar-university/README.md secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Synchronize BU-SP3 identity Batch 3 state"
            git push
          fi
