name: Temporary Kaalap Final Release Review V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-kaalap-final-release-review-v2.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate final English release and publish report
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess

          work = Path('poems/kaalap-pezhaiyum-kavithai-saaviyum')
          en = work / 'translations/en'
          assembled_path = en / 'kaalap-pezhaiyum-kavithai-saaviyum-en.md'
          sections = work / 'sections'
          pages = work / 'pages'
          batches = en / 'batches'
          items = en / 'items'

          TAMIL_CLEARANCE = '09551dbe9bf6615d4b3c26f21792151ba64089e4'
          EDITORIAL_SHA = '902cbb83d3746e42947ed0639652623907a544b40fdabee748878e432f5ec87e'
          DISCREPANCIES = {18,22,25,26,29,31,32,37,40,44,46,50,54,58}

          def qfield(text, key):
              m = re.search(rf'^{re.escape(key)}: "(.*)"$', text, re.M)
              return m.group(1) if m else None

          def intfield(text, key):
              m = re.search(rf'^{re.escape(key)}: (\d+)$', text, re.M)
              return int(m.group(1)) if m else None

          def scan_range(s):
              s = s.replace('–','-').replace('—','-').strip()
              if '-' in s:
                  a,b = map(int, s.split('-',1))
                  return list(range(a,b+1))
              return [int(s)]

          assembled = assembled_path.read_text(encoding='utf-8')
          raw = assembled_path.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          assert digest == EDITORIAL_SHA, (digest, EDITORIAL_SHA)
          assert len(raw) == 321102
          assert len(assembled.splitlines()) == 16308

          hpat = re.compile(r'^## Item (\d+) — (.+)$', re.M)
          am = list(hpat.finditer(assembled))
          assert [int(m.group(1)) for m in am] == list(range(1,59))
          assembled_items = {}
          for i,m in enumerate(am):
              n = int(m.group(1))
              end = am[i+1].start() if i+1 < len(am) else len(assembled)
              assembled_items[n] = {
                  'title_en': m.group(2).strip(),
                  'section': assembled[m.start():end].rstrip() + '\n',
                  'body': assembled[m.end():end].lstrip('\n').rstrip() + '\n'
              }

          titles_ta, contents_ta, ranges = {}, {}, {}
          all_expected = []
          for n in range(1,59):
              c = (sections / f'{n:02d}.md').read_text(encoding='utf-8')
              assert intfield(c,'item') == n
              titles_ta[n] = qfield(c,'title')
              contents_ta[n] = qfield(c,'contents_title')
              ranges[n] = scan_range(qfield(c,'physical_scans'))
              all_expected.extend(ranges[n])
              got = [int(x) for x in re.findall(r'<!-- scan (\d+) -->', assembled_items[n]['section'])]
              assert got == ranges[n], (n, ranges[n], got)
          assert all_expected == list(range(10,300))
          assert [int(x) for x in re.findall(r'<!-- scan (\d+) -->', assembled)] == list(range(10,300))
          assert '<!-- scan 300 -->' not in assembled

          # Extract only the English-translation body from each durable batch record.
          batch_items = {}
          batch_files = sorted(batches.glob('batch-*.md'))
          assert len(batch_files) == 21
          for bp in batch_files:
              bt = bp.read_text(encoding='utf-8')
              bm = list(hpat.finditer(bt))
              for i,m in enumerate(bm):
                  n = int(m.group(1))
                  end_candidates = [len(bt)]
                  if i+1 < len(bm):
                      end_candidates.append(bm[i+1].start())
                  for marker in ('\n## Translator notes', '\n## Batch review'):
                      p = bt.find(marker, m.end())
                      if p != -1:
                          end_candidates.append(p+1)
                  end = min(x for x in end_candidates if x > m.start())
                  trans = re.search(r'^### English translation\s*$', bt[m.end():end], re.M)
                  assert trans, (bp.name, n)
                  absolute_start = m.end() + trans.end()
                  body = bt[absolute_start:end].lstrip('\n').rstrip() + '\n'
                  sec = f'## Item {n} — {m.group(2).strip()}\n\n' + body
                  assert n not in batch_items
                  batch_items[n] = sec
          assert sorted(batch_items) == list(range(1,59))
          for n in range(1,59):
              assert batch_items[n] == assembled_items[n]['section'], n

          # Validate all 58 standalone files against canonical metadata and assembled bodies.
          standalone = sorted(p for p in items.glob('*.md') if p.name != 'README.md')
          assert len(standalone) == 58
          seen = set()
          for p in standalone:
              t = p.read_text(encoding='utf-8')
              n = intfield(t,'item')
              assert n and n not in seen
              seen.add(n)
              assert qfield(t,'title_ta') == titles_ta[n]
              assert qfield(t,'contents_title_ta') == contents_ta[n]
              assert qfield(t,'title_en') == assembled_items[n]['title_en']
              assert scan_range(qfield(t,'source_scans')) == ranges[n]
              status = 'documented-discrepancy' if n in DISCREPANCIES else 'match'
              assert qfield(t,'title_witness_status') == status
              fm = t.split('---\n',2)
              assert len(fm) == 3
              after = fm[2].lstrip('\n')
              h1 = f"# {assembled_items[n]['title_en']}\n\n"
              assert after.startswith(h1)
              body = after[len(h1):].rstrip() + '\n'
              assert body == assembled_items[n]['body'], n
              assert [int(x) for x in re.findall(r'<!-- scan (\d+) -->', body)] == ranges[n]
          assert seen == set(range(1,59))

          actual_disc = {n for n in range(1,59) if titles_ta[n] != contents_ta[n]}
          assert actual_disc == DISCREPANCIES
          assert intfield((sections/'37.md').read_text(encoding='utf-8'),'printed_item_number') == 36

          lines = assembled.splitlines()
          assert sum(x == '★ ★ ★' for x in lines) == 53
          assert sum(x == '★     ★     ★' for x in lines) == 6
          assert sum(x == '★' for x in lines) == 2
          assert assembled.count('**Note:**') == 4
          for marker in ('## Translator notes','## Batch review','Source metadata:','title_witness_status:','contents_title_ta:','translation_basis:'):
              assert marker not in assembled, marker

          assert assembled.count('(First Part Complete)') == 1
          assert assembled.rstrip().splitlines()[-1] == '(First Part Complete)'
          assert [int(x) for x in re.findall(r'<!-- scan (\d+) -->', assembled_items[58]['section'])] == [296,297,298,299]

          changed = subprocess.check_output([
              'git','diff','--name-only',f'{TAMIL_CLEARANCE}..HEAD','--',str(sections),str(pages)
          ], text=True).strip()
          assert not changed, changed

          idx = (items/'README.md').read_text(encoding='utf-8')
          assert [int(x) for x in re.findall(r'^\| (\d+) \|', idx, re.M)] == list(range(1,59))

          review_input = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          report = [
              '# English Release Report — காலப் பேழையும் கவிதைச் சாவியும்','',
              'Status: **FINAL SOURCE-COVERAGE / RELEASE REVIEW COMPLETE — PASS**','',
              'Release gate date: **2026-08-30**','',
              '## Scope','',
              'This is the final Phase-4 release gate for the English translation of the 58-item numbered collection **காலப் பேழையும் கவிதைச் சாவியும்**.','',
              'Reader-facing collection: `kaalap-pezhaiyum-kavithai-saaviyum-en.md`.','',
              'Standalone distribution: `items/` — **58/58** separate English item files plus `items/README.md`.','',
              'This is a source-coverage, synchronization, provenance and release-integrity review; it is **not** a fresh pixel-level rereading of all 290 numbered-item scans. Tamil textual authority remains the final-cleared canonical/page layer and, if reopened, the controlling scan.','',
              '## Release checkpoints','',
              f'- Tamil final-clearance durable checkpoint: `{TAMIL_CLEARANCE}`;',
              f'- release-review input commit: `{review_input}`;',
              f'- editorial-reviewed assembled SHA-256: `{digest}`;',
              f'- reader-facing size: **{len(raw):,} bytes**;',
              f'- reader-facing line count: **{len(assembled.splitlines()):,}**.','',
              '## 1. Item and scan source coverage','', 'Result: **PASS**','',
              '- stable numbered items: **58/58**, exactly once and in order;',
              '- numbered-item scans: **290/290**, exactly scans **10–299**, once each and in order;',
              '- every item scan-marker sequence matches its canonical `physical_scans` range;',
              '- scan-300 end matter is excluded.','',
              '## 2. Reviewed-batch synchronization','', 'Result: **PASS**','',
              '- reviewed batches: **21/21**;',
              '- batch item inventory: **1–58 exactly once**;',
              '- each assembled item heading plus English translation body is byte-for-byte aligned with the corresponding reviewed batch translation body.','',
              '## 3. Standalone per-poem synchronization','', 'Result: **PASS**','',
              '- standalone files: **58/58**;',
              '- stable standalone identities: **1–58 exactly once**;',
              '- each standalone translated body is byte-for-byte aligned with the corresponding assembled item body;',
              '- canonical Tamil title, contents-title witness, English title, witness status and scan range are synchronized;',
              '- `items/README.md` indexes items **1–58** exactly once and in order.','',
              '## 4. Title-witness integrity','', 'Result: **PASS**','',
              'The discrepancy register remains exactly **18, 22, 25, 26, 29, 31, 32, 37, 40, 44, 46, 50, 54 and 58**. Canonical/title-page and contents witnesses remain separate. Item 37 remains stable item 37 while printed item number 36 is preserved only as a source anomaly.','',
              '## 5. Source-visible structure','', 'Result: **PASS**','',
              'The reader-facing collection is byte-identical to the full-work editorial-PASS checkpoint. Its structural inventory remains **53** compact `★ ★ ★` separators, **6** wide `★     ★     ★` separators, **2** single `★` separators, **4** `**Note:**` blocks and **290** scan-provenance comments.','',
              'Because every item is also byte-aligned with its reviewed batch translation body, previously cleared quotations, dialogue, glossary material, parenthetical source material and high-risk item structures remain intact.','',
              '## 6. Reader-facing cleanliness','', 'Result: **PASS**','',
              'No batch/editorial apparatus is present in the reader-facing collection.','',
              '## 7. Tamil-source protection','', 'Result: **PASS**','',
              'A Git comparison from the durable Tamil final-clearance checkpoint through the release-review input commit found **0 changed files** under the canonical `sections/` and verified `pages/` directories.','',
              '## 8. Final boundary','', 'Result: **PASS**','',
              'Item 58 contains scans **296–299** and the collection ends exactly with `(First Part Complete)`, occurring once. Scan-300 end matter remains excluded.','',
              '## Final decision','',
              '**ENGLISH PHASE 4 RELEASE: PASS — RELEASE-CLEARED**','',
              '- translation batches: **21/21 reviewed PASS**;',
              '- stable items: **58/58**;',
              '- numbered-item scans: **290/290**;',
              '- complete English collection: **release-cleared**;',
              '- standalone English item files: **58/58 release-cleared synchronized copies**;',
              '- unresolved release issues: **0**;',
              '- Tamil canonical/page files changed during Phase 4: **0**.','',
              'The English translation phase for this numbered first-part collection is complete. No further Phase-4 release gate remains.',''
          ]
          (en/'RELEASE_REPORT.md').write_text('\n'.join(report), encoding='utf-8')

          readme = en/'README.md'
          s = readme.read_text(encoding='utf-8')
          s = re.sub(r'^Status: \*\*.*\*\*$', 'Status: **PHASE 4 COMPLETE — ENGLISH RELEASE CLEARED — PASS; 58/58 items; 290/290 numbered-item scans; 58/58 standalone per-poem files**', s, count=1, flags=re.M)
          s = s.replace('5. perform source-coverage/release review — **NEXT**;', '5. perform source-coverage/release review — **COMPLETE — PASS**;')
          s = s.replace('6. mark English release complete only if all gates pass.', '6. mark English release complete only if all gates pass — **COMPLETE — RELEASE-CLEARED**.')
          p = s.find('## Exact next activity\n')
          if p != -1:
              s = s[:p] + '## Completion boundary\n\nThe final source-coverage/release gate is **COMPLETE — PASS**. See `RELEASE_REPORT.md`. No further Phase-4 English release activity remains for this numbered first-part collection.\n'
          readme.write_text(s, encoding='utf-8')

          plan = en/'TRANSLATION_PLAN.md'
          s = plan.read_text(encoding='utf-8')
          s = re.sub(r'^\*\*PHASE 4 IN PROGRESS —.*\*\*$', '**PHASE 4 COMPLETE — English release CLEARED — PASS; 21/21 reviewed batches, 58/58 items, 290/290 scans, complete assembly, editorial review and final release review complete.**', s, count=1, flags=re.M)
          p = s.find('## Exact next activity\n')
          if p != -1:
              s = s[:p] + '## Completion boundary\n\nFinal source-coverage/release review: **COMPLETE — PASS**. Durable record: `RELEASE_REPORT.md`. Phase 4 is complete.\n'
          plan.write_text(s, encoding='utf-8')

          smap = en/'SOURCE_MAP.md'
          s = smap.read_text(encoding='utf-8')
          p = s.find('## Exact next activity\n')
          if p != -1:
              s = s[:p] + '## Completion boundary\n\nFinal source-coverage/release review: **COMPLETE — PASS**. See `RELEASE_REPORT.md`. All 58 items, scans 10–299, reviewed batches, assembled collection and standalone files are release-cleared and synchronized.\n'
          if 'final full-work source-coverage / release review: **COMPLETE — PASS**' not in s:
              s += '\n- final full-work source-coverage / release review: **COMPLETE — PASS**\n'
          smap.write_text(s, encoding='utf-8')

          idxp = items/'README.md'
          s = idxp.read_text(encoding='utf-8')
          s = s.replace('Status: **COMPLETE — 58/58 standalone item files generated from the editorial-reviewed English collection**', 'Status: **RELEASE-CLEARED — 58/58 standalone item files synchronized with the final English release**')
          if 'Release gate: **PASS**' not in s:
              s += '\nRelease gate: **PASS** — see `../RELEASE_REPORT.md`.\n'
          idxp.write_text(s, encoding='utf-8')

          ed = en/'EDITORIAL_CONSISTENCY_REVIEW.md'
          s = ed.read_text(encoding='utf-8')
          if '## Subsequent release outcome' not in s:
              s += '\n## Subsequent release outcome\n\nThe final source-coverage/release review subsequently completed **PASS**. See `RELEASE_REPORT.md`. The editorial-reviewed reader-facing SHA-256 remained unchanged through that final gate.\n'
          ed.write_text(s, encoding='utf-8')

          print('FINAL RELEASE REVIEW: PASS')
          print('items=58 scans=290 batches=21 standalone=58 unresolved=0')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/RELEASE_REPORT.md \
                  poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/README.md \
                  poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/TRANSLATION_PLAN.md \
                  poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/SOURCE_MAP.md \
                  poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/EDITORIAL_CONSISTENCY_REVIEW.md \
                  poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/items/README.md
          git diff --cached --quiet || git commit -m "Complete Kaalap English final release review"
          git push
