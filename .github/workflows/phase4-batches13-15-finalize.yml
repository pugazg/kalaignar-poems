name: Finalize Kalaignarin Kavithaigal Batches 13-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase4-batches13-15-finalize.yml'
      - 'scripts/finalize-kalaignarin-kavithaigal-batches13-15.py'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and synchronize Batches 13-15
        run: python3 scripts/finalize-kalaignarin-kavithaigal-batches13-15.py
      - name: Remove one-shot finalizer
        run: |
          rm -f .github/workflows/phase4-batches13-15-finalize.yml
          rm -f scripts/finalize-kalaignarin-kavithaigal-batches13-15.py
      - name: Commit finalized Batches 13-15
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize Kalaignarin Kavithaigal Phase 4 Batches 13-15'
          git push origin main
