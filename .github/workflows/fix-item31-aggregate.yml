name: Verify item 31 aggregate synchronization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-item31-aggregate.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify synchronized aggregate and report metrics
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          path = Path("poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/kaalap-pezhaiyum-kavithai-saaviyum-en.md")
          data = path.read_bytes()
          text = data.decode("utf-8")

          new_heading = "## Item 31 — The Mother Full of Dignity and the Stainless Daughter!"
          new_opening = "and the stainless daughter!"
          old_heading = "## Item 31 — The Mother Full of Dignity and the Stainless Son!"
          old_opening = "and the stainless son!"

          assert text.count(new_heading) == 1
          assert text.count(new_opening) == 1
          assert text.count(old_heading) == 0
          assert text.count(old_opening) == 0

          print(f"SHA256={hashlib.sha256(data).hexdigest()}")
          print(f"BYTES={len(data)}")
          print(f"LINES={len(text.splitlines())}")
          print("NEW_HEADING_COUNT=1")
          print("NEW_OPENING_COUNT=1")
          print("OLD_HEADING_COUNT=0")
          print("OLD_OPENING_COUNT=0")
