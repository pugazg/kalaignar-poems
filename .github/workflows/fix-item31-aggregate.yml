name: Close item 31 post-release synchronization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-item31-aggregate.yml

permissions:
  contents: write

jobs:
  close-records:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize post-release records
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import re

          aggregate = Path("poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/kaalap-pezhaiyum-kavithai-saaviyum-en.md")
          data = aggregate.read_bytes()
          text = data.decode("utf-8")
          sha256 = hashlib.sha256(data).hexdigest()
          byte_count = len(data)
          line_count = len(text.splitlines())

          expected_sha = "8037357fe359646f9d8ad86f2ee3bb3b215422c7735faffa2b61f29b20a99c3c"
          assert sha256 == expected_sha, (sha256, expected_sha)
          assert byte_count == 321112
          assert line_count == 16308
          assert text.count("## Item 31 — The Mother Full of Dignity and the Stainless Daughter!") == 1
          assert text.count("and the stainless daughter!") == 1
          assert text.count("## Item 31 — The Mother Full of Dignity and the Stainless Son!") == 0
          assert text.count("and the stainless son!") == 0

          def append_once(path, marker, block):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if marker not in s:
                  s = s.rstrip() + "\n\n" + block.strip() + "\n"
                  p.write_text(s, encoding="utf-8")

          release_addendum = f"""
          ## Post-release item-31 source correction — 2026-09-08

          Status: **SOURCE-BACKED TITLE REOPEN CLOSED / ENGLISH RELEASE RE-CLEARED — PASS**

          After the original 2026-08-30 release gate, the controlling Tamil source was reread for stable item **31**. Direct scan **148** establishes the item-opening/title-page witness as `மாண்பு நிறை தாயும் மாசற்ற மகளும்!`; the contents witness remains separately preserved as `மாண்பு நிறை தாயும், மாசற்ற மகனும்!`.

          The canonical English title is therefore **The Mother Full of Dignity and the Stainless Daughter!**. This is a title-only source correction; the narrative/body text, stable item number, scan range and boundaries are unchanged.

          ### Re-synchronization result

          - reader-facing aggregate synchronization commit: `a77ecd4c2d89c052bbc48dd7912aaf6d1575d475`;
          - current reader-facing SHA-256: `{sha256}`;
          - current reader-facing size: **{byte_count:,} bytes**;
          - current reader-facing line count: **{line_count:,}**;
          - corrected Daughter item-31 heading: **1**;
          - corrected Daughter opening line: **1**;
          - obsolete item-31 Son heading: **0**;
          - obsolete item-31 Son opening line: **0**;
          - reviewed Batch 12 title layer: synchronized;
          - standalone item 31: `items/31-the-mother-full-of-dignity-and-the-stainless-daughter-en.md` — synchronized;
          - standalone index: synchronized;
          - contents `மகனும்` witness: retained unchanged as source metadata;
          - unresolved post-release synchronization issues: **0**.

          The SHA-256/size values in the original **Release checkpoints** section above remain the historical 2026-08-30 release-gate snapshot. The values in this addendum are the current reader-facing artifact after the documented source-backed correction.

          **Post-release decision: PASS — 58/58 English items remain release-cleared, with item 31 re-cleared under the corrected title.**
          """
          append_once(
              "poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/RELEASE_REPORT.md",
              "## Post-release item-31 source correction — 2026-09-08",
              release_addendum,
          )

          correction_closure = f"""
          ## Synchronization closure

          The downstream release surfaces have now been synchronized and verified.

          - reader-facing aggregate commit: `a77ecd4c2d89c052bbc48dd7912aaf6d1575d475`;
          - aggregate SHA-256: `{sha256}`;
          - aggregate size: **{byte_count:,} bytes**;
          - aggregate line count: **{line_count:,}**;
          - `Daughter` item-31 heading/opening occurrences: **1 / 1**;
          - obsolete `Son` item-31 heading/opening occurrences: **0 / 0**;
          - reviewed Batch 12: synchronized;
          - standalone English item 31 and `items/README.md`: synchronized;
          - work-level English release: **RE-CLEARED — PASS**;
          - unresolved synchronization holds: **0**.

          The source-backed reopen is therefore **CLOSED**. Routine work may return to the Bharathiar University secondary-witness queue.
          """
          append_once(
              "poems/kaalap-pezhaiyum-kavithai-saaviyum/POST_RELEASE_ITEM31_TITLE_CORRECTION.md",
              "## Synchronization closure",
              correction_closure,
          )

          p = Path("poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/README.md")
          s = p.read_text(encoding="utf-8")
          old = "Item 31 preserves the verified canonical `மகனும்` title reading despite the mother-daughter narrative and keeps its title-witness comma difference;"
          new = "Item 31 now follows the documented post-release source correction: direct scan 148 title-page witness is `மகளும்`, while contents `மகனும்` remains separately preserved;"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          marker = "## Post-release item-31 correction\n"
          if marker not in s:
              insertion = f"""
          ## Post-release item-31 correction

          On **2026-09-08**, direct reread of controlling Tamil scan **148** corrected the canonical item-31 title from the accidentally conflated contents form `மகனும்` to the actual title-page form `மகளும்`. English item 31 is now **The Mother Full of Dignity and the Stainless Daughter!**; contents `மகனும்` remains preserved separately.

          The reader-facing aggregate is re-synchronized and verified at SHA-256 `{sha256}`, **{byte_count:,} bytes / {line_count:,} lines**. The release remains **RE-CLEARED — PASS** with **0** unresolved synchronization issues. See `../POST_RELEASE_ITEM31_TITLE_CORRECTION.md` and `RELEASE_REPORT.md`.

          """
              anchor = "## Batch review rule\n"
              assert anchor in s
              s = s.replace(anchor, insertion.lstrip() + anchor, 1)
          p.write_text(s, encoding="utf-8")

          p = Path("poems/kaalap-pezhaiyum-kavithai-saaviyum/README.md")
          s = p.read_text(encoding="utf-8")
          if "## Post-release item-31 correction" not in s:
              block = f"""
          ## Post-release item-31 correction

          On **2026-09-08**, a direct visual reread of controlling scan **148** established the canonical poem-page title as **`மாண்பு நிறை தாயும் மாசற்ற மகளும்!`**. Contents **`மாண்பு நிறை தாயும், மாசற்ற மகனும்!`** remains a separate contents witness.

          The Tamil title layer, Batch 12, standalone English item/index and reader-facing English aggregate have been synchronized and re-cleared. Current aggregate: SHA-256 `{sha256}`, **{byte_count:,} bytes / {line_count:,} lines**. Obsolete item-31 `Son` aggregate heading/opening occurrences: **0 / 0**. See `POST_RELEASE_ITEM31_TITLE_CORRECTION.md`.

          """
              anchor = "## Completion boundary\n"
              assert anchor in s
              s = s.replace(anchor, block.lstrip() + anchor, 1)
          p.write_text(s, encoding="utf-8")

          p = Path("HANDOVER.md")
          s = p.read_text(encoding="utf-8")
          old = "First ensure the post-release item-31 correction is synchronized across the reader-facing English aggregate/release-status records. Then proceed with **Secondary Witness Comparison Batch 5 — final BU-TT entries 31–34**, mapped to repository items **53, 55, 56 and 57**."
          new = "The post-release item-31 correction is now **fully synchronized / re-cleared** across Tamil title authority, reviewed Batch 12, standalone English item/index and the reader-facing aggregate (SHA-256 `8037357fe359646f9d8ad86f2ee3bb3b215422c7735faffa2b61f29b20a99c3c`, 321,112 bytes / 16,308 lines; obsolete item-31 `Son` aggregate heading/opening 0/0). Proceed with **Secondary Witness Comparison Batch 5 — final BU-TT entries 31–34**, mapped to repository items **53, 55, 56 and 57**."
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          p = Path("NEXT_CHAT_PROMPT.md")
          s = p.read_text(encoding="utf-8")
          pattern = re.compile(r"## Immediate synchronization guardrail\n\n.*?## Exact next activity — final BU-TT Batch 5\n\nOnce item-31 release surfaces are synchronized, process", re.S)
          replacement = f"""## Item-31 post-release synchronization — CLOSED

          Direct scan-148 title `மகளும்` is now synchronized through canonical Tamil, reviewed Batch 12, standalone English item/index and the reader-facing aggregate. Current aggregate SHA-256 `{sha256}`, **{byte_count:,} bytes / {line_count:,} lines**; obsolete item-31 `Son` heading/opening **0 / 0**. English release status: **RE-CLEARED — PASS**. Governing record: `poems/kaalap-pezhaiyum-kavithai-saaviyum/POST_RELEASE_ITEM31_TITLE_CORRECTION.md`.

          ## Exact next activity — final BU-TT Batch 5

          Process"""
          s2, n = pattern.subn(replacement, s, count=1)
          assert n == 1, n
          p.write_text(s2, encoding="utf-8")

          p = Path("secondary-witnesses/bharathiar-university/README.md")
          s = p.read_text(encoding="utf-8")
          old = "Before/alongside final BU-TT Batch 5, keep the item-31 post-release synchronization record authoritative. Then complete **entries 31–34**, mapped to repository items **53, 55, 56 and 57**."
          new = "Item-31 post-release synchronization is **complete / re-cleared**. Complete **entries 31–34**, mapped to repository items **53, 55, 56 and 57**."
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          p = Path("secondary-witnesses/bharathiar-university/comparisons/03A-item31-title-correction.md")
          s = p.read_text(encoding="utf-8")
          if "## Downstream release synchronization" not in s:
              block = f"""

          ## Downstream release synchronization

          The corrected title has now propagated through reviewed Batch 12, standalone English item/index and the reader-facing English aggregate. Aggregate SHA-256 `{sha256}`, **{byte_count:,} bytes / {line_count:,} lines**; obsolete item-31 `Son` heading/opening **0 / 0**. Work-level English release status is **RE-CLEARED — PASS**.
          """
              s = s.rstrip() + block + "\n"
              p.write_text(s, encoding="utf-8")

      - name: Commit synchronized records
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOVER.md NEXT_CHAT_PROMPT.md \
            poems/kaalap-pezhaiyum-kavithai-saaviyum/README.md \
            poems/kaalap-pezhaiyum-kavithai-saaviyum/POST_RELEASE_ITEM31_TITLE_CORRECTION.md \
            poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/README.md \
            poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/RELEASE_REPORT.md \
            secondary-witnesses/bharathiar-university/README.md \
            secondary-witnesses/bharathiar-university/comparisons/03A-item31-title-correction.md
          git commit -m "Close item 31 post-release synchronization [skip ci]"
          git push
