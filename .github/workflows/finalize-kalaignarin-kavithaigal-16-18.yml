name: Finalize Kalaignarin Kavithaigal Phase 4 Batches 16-18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-kalaignarin-kavithaigal-16-18.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate and finalize remaining translations
        run: python scripts/finalize-kalaignarin-kavithaigal-16-18.py
      - name: Commit synchronized final item-review state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Finalize Kalaignarin Kavithaigal Phase 4 Batches 16-18'
            git push
          fi
