name: OCR BU-SP3 Batch 5 source pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ocr-bu-sp3-batch4.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - name: Download exact source and OCR physical pages 177-220
        shell: bash
        run: |
          set -euo pipefail
          URL='https://tamildigitallibrary.in/assets/docs/uploads/primary_files/book/TVA_BOK_0065524/TVA_BOK_0065524_Shower_of_poetry_Vol_3.pdf'
          curl -L --fail --retry 3 "$URL" -o /tmp/bu-sp3.pdf
          echo "SIZE $(stat -c%s /tmp/bu-sp3.pdf)"
          echo "SHA256 $(sha256sum /tmp/bu-sp3.pdf | awk '{print $1}')"
          pdfinfo /tmp/bu-sp3.pdf | grep '^Pages:'
          mkdir -p /tmp/bu-sp3-pages
          pdftoppm -f 177 -l 220 -r 180 -jpeg /tmp/bu-sp3.pdf /tmp/bu-sp3-pages/p >/dev/null 2>&1
          page=177
          for img in $(find /tmp/bu-sp3-pages -type f -name 'p-*.jpg' | sort -V); do
            echo "===== PHYSICAL_PAGE_${page} ====="
            tesseract "$img" stdout -l eng --psm 6 2>/dev/null || true
            echo "===== END_PHYSICAL_PAGE_${page} ====="
            page=$((page+1))
          done
