name: Kalaignarin Kavithaigal assemble and release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Run Kalaignarin Kavithaigal English release assembly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch YAML quote decoding and assemble
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/kavithaigal_assemble_release.py')
          t=p.read_text()
          old="""        if len(v)>=2 and v[0]==v[-1]=='\"':\n            v=v[1:-1]\n"""
          new="""        if len(v)>=2 and v[0]==v[-1]=='\"':\n            v=v[1:-1].replace('\\\\\"','\"').replace('\\\\\\\\','\\\\')\n"""
          if old not in t:
              raise SystemExit('parser patch target missing')
          p.write_text(t.replace(old,new,1))
          PY
          python .github/scripts/kavithaigal_assemble_release.py
