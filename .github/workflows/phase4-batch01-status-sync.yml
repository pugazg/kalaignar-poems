name: Phase4 Batch01 Status Sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase4-batch01-status-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize Phase 4 Batch 01 durable status
        run: python3 .github/phase4_batch01_status_sync.py
      - name: Validate translation milestone scope
        run: |
          test -z "$(git diff --name-only | grep -E '^poems/kalaignarin-kavithaigal/(pages|sections)/' || true)"
          grep -q 'Batch 01 reviewed PASS' HANDOVER.md
          grep -q 'Batch 02' HANDOVER.md
          grep -q 'Batch 01 reviewed PASS' NEXT_CHAT_PROMPT.md
          grep -q 'Batch 02' NEXT_CHAT_PROMPT.md
          grep -q 'IN PROGRESS — Batch 01 reviewed PASS' TRANSCRIPTION_PHASE_PLAN.md
          grep -q '01-give-me-your-heart-anna-en.md' poems/kalaignarin-kavithaigal/translations/en/SOURCE_MAP.md
          test -f poems/kalaignarin-kavithaigal/translations/en/items/01-give-me-your-heart-anna-en.md
          test -f poems/kalaignarin-kavithaigal/translations/en/batches/batch-01.md
          test ! -e NOPE
      - name: Commit status synchronization and remove one-shot runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/phase4_batch01_status_sync.py .github/workflows/phase4-batch01-status-sync.yml
          git add -A
          git diff --cached --check
          git commit -m "Synchronize Kalaignarin Kavithaigal Phase 4 Batch 01 status"
          git push origin HEAD:main
