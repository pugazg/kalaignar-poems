name: Synchronize BU-SP1 identity batches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-sp1-identity-batches.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize durable identity records
        shell: python
        run: |
          from pathlib import Path

          # Per-book crosswalk.
          p = Path('secondary-witnesses/bharathiar-university/shower-of-poetry-vol-1/crosswalk.md')
          t = p.read_text(encoding='utf-8')
          replacements = {
            '| 2 | Periyar | 3 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 2 | Periyar | 3 | **MATCHED** | poems/kalaignarin-kavithaigal/ item 26 (embedded earlier Periyar poem) | payload match: Erode-earthquake / E.V.R.-cyclone / white-beard / Black-Shirts sequence quoted inside `தந்தை பெரியார்` |',
            '| 3 | The Mother in Puranaanooru - 1 | 4 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 3 | The Mother in Puranaanooru - 1 | 4 | **NOT YET REPRESENTED** | — | Purananuru-278 mother/warrior work; no current source-backed repository representation established |',
            "| 4 | Students' Awakening! | 7 | **INVESTIGATE** | — | not yet item-matched against all repository collections |": "| 4 | Students' Awakening! | 7 | **NOT YET REPRESENTED** | — | distinct dated-1945 student-awakening poem; no current source-backed repository representation established |",
            '| 5 | Green Parrot! | 8 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 5 | Green Parrot! | 8 | **MATCHED** | poems/kalaignarin-kavithaigal/ item 56 | `பச்சைக் கிளி`: same portrait → cage/prison → freedom → reciprocal-caging payload |',
            '| 6 | The Mother in Puranaanooru - 2 | 10 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 6 | The Mother in Puranaanooru - 2 | 10 | **MATCHED** | poems/marathi/ | `மறத்தி`: same father → husband → son battlefield sequence / Purananuru-279 frame |',
            '| 7 | A Heroic Warrior Killed | 14 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 7 | A Heroic Warrior Killed | 14 | **MATCHED** | poems/kalaignarin-kavithaigal/ item 43 | `மறைந்த மாவீரன்`: same K.V.K. Sami lover-warrior / assassination narrative |',
            '| 10 | The Mother in Puranaanooru - 3 | 26 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 10 | The Mother in Puranaanooru - 3 | 26 | **NOT YET REPRESENTED** | — | distinct Purananuru-286 mother/war work, dated 1964; no current source-backed repository representation established |',
            '| 17 | The Paari Festival | 80 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 17 | The Paari Festival | 80 | **MATCHED** | poems/kalaignarin-kaviyaranga-kavithaigal-1975/ Item 02 | same Parambu Hill / Pari presiding poem; BU 05-05-1970 metadata conflicts with controlling source 5-5-71 |',
            '| 20 | The Fountain of Imagination | 96 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 20 | The Fountain of Imagination | 96 | **MATCHED** | poems/kalaignarin-kavithaigal/ item 57 | same Orlando fountain / Apollo / colour / kolam / sari-joke payload |',
            '| 24 | Pour Plenteously O Sky! | 116 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 24 | Pour Plenteously O Sky! | 116 | **MATCHED** | poems/kalaignarin-kavithaigal/ item 58 | same drought / sky-address / political-slander / three-rains payload |',
            '| 29 | Some Countries there are! | 142 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 29 | Some Countries there are! | 142 | **MATCHED** | poems/kalaignarin-kavithaigal/ item 76 | same democracy-child / coup / Bangladesh / Bangabandhu / Ziaur Rahiman payload |',
            '| 31 | Gallows | 148 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 31 | Gallows | 148 | **NOT YET REPRESENTED** | — | distinct 10-05-1982 eight-day / 200-km justice march to Tiruchendur; no current representation established |',
            '| 32 | You do Praises Shower on Me, the Humblest Self! | 152 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 32 | You do Praises Shower on Me, the Humblest Self! | 152 | **NOT YET REPRESENTED** | — | distinct autobiographical 03-06-1982 / 58th-birthday poem; no current representation established |',
            '| 34 | Enmity Conquer We Shall! | 159 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 34 | Enmity Conquer We Shall! | 159 | **NOT YET REPRESENTED** | — | distinct Anna/lamp/victory-path poem dated 15-09-1987; no current representation established |',
            "| 35 | At Anna Salai, on the Day of M.G.R's Death | 161 | **INVESTIGATE** | — | not yet item-matched against all repository collections |": "| 35 | At Anna Salai, on the Day of M.G.R's Death | 161 | **NOT YET REPRESENTED** | — | 27-12-1987 poem after Kalaignar's Anna-Salai statue was damaged; no current representation established |",
            '| 36 | Mutability! | 163 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 36 | Mutability! | 163 | **NOT YET REPRESENTED** | — | distinct 22-11-1990 mutability/permanence poem; no current representation established |',
            '| 37 | This I Dedicate | 166 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 37 | This I Dedicate | 166 | **NOT YET REPRESENTED** | — | distinct 10-08-1992 dedication naming Anjugam, Periyar, Anna and Murasoli; no current representation established |',
            '| 38 | Like a Speeding Spear | 167 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 38 | Like a Speeding Spear | 167 | **NOT YET REPRESENTED** | — | distinct 05-12-1992 karseva/Babri-Masjid political poem; no current representation established |',
            '| 41 | Do Not Your Onward March Give up! | 175 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 41 | Do Not Your Onward March Give up! | 175 | **MATCHED** | poems/kalaignarin-kavithaigal/ item 66 | `நடையை நிறுத்தாதே!`: same dogs/thorns/torrent/journey/duty-dignity-discipline payload |',
            '| 42 | We Shall Tear the Mask to Pieces! | 178 | **INVESTIGATE** | — | not yet item-matched against all repository collections |': '| 42 | We Shall Tear the Mask to Pieces! | 178 | **MATCHED** | poems/kalaignarin-kavithaigal/ item 70 | `முகமூடி கிழித்தெறிவோம் வாரீர்!`: same fraudulent-ascetic polemic and mask-tearing close |',
          }
          for old, new in replacements.items():
              if old not in t:
                  raise SystemExit(f'crosswalk row missing: {old[:70]}')
              t = t.replace(old, new, 1)
          t = t.replace('**22 MATCHED / 0 POSSIBLE / 30 INVESTIGATE = 52.**', '**32 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 10 INVESTIGATE = 52.**')
          t = t.replace('Current tally: **22 MATCHED / 0 POSSIBLE / 30 INVESTIGATE = 52**.', 'Current tally after identity Batches 1–2: **32 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 10 INVESTIGATE = 52**.')
          t = t.replace('Classification remains **22 MATCHED / 0 POSSIBLE / 30 INVESTIGATE**.', 'Payload-comparison closure covered the 22 matches known at that stage; identity Batches 1–2 later hardened ten additional matches. Current classification is **32 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 10 INVESTIGATE**.')
          t += '''\n## Identity investigation Batch 1 — COMPLETE — 2026-09-08\n\nAuthority: `../comparisons/10-shower-of-poetry-vol-1-identity-investigation-batch-01.md`. Entries **2, 5, 6, 7, 17, 20, 24** → MATCHED; entries **3, 4, 10** → NOT YET REPRESENTED. No Tamil or released-English mutations.\n\n## Identity investigation Batch 2 — COMPLETE — 2026-09-08\n\nAuthority: `../comparisons/11-shower-of-poetry-vol-1-identity-investigation-batch-02.md`. Entries **29, 41, 42** → MATCHED; entries **31, 32, 34, 35, 36, 37, 38** → NOT YET REPRESENTED. Current tally: **32 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 10 INVESTIGATE = 52**. Remaining INVESTIGATE rows: **43–52**.\n'''
          p.write_text(t, encoding='utf-8')

          # Secondary witness README.
          p = Path('secondary-witnesses/bharathiar-university/README.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace('Volume I: **52** — 22 MATCHED / 0 POSSIBLE / 30 INVESTIGATE;', 'Volume I: **52** — 32 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 10 INVESTIGATE;')
          t = t.replace('Current hardened crosswalk: **57 MATCHED / 0 POSSIBLE / 39 NOT YET REPRESENTED / 80 INVESTIGATE = 176**.', 'Current hardened crosswalk: **67 MATCHED / 0 POSSIBLE / 49 NOT YET REPRESENTED / 60 INVESTIGATE = 176**.')
          marker = '## Next activity\n\nBegin **BU-SP1 identity investigation Batch 1**'
          if marker not in t:
              raise SystemExit('secondary README next marker missing')
          t = t.split('## Next activity\n', 1)[0] + '''### BU-SP1 identity investigation Batches 1–2 — COMPLETE\n\n- Batch 1: `comparisons/10-shower-of-poetry-vol-1-identity-investigation-batch-01.md` — **7 MATCHED / 3 NOT YET REPRESENTED**.\n- Batch 2: `comparisons/11-shower-of-poetry-vol-1-identity-investigation-batch-02.md` — **3 MATCHED / 7 NOT YET REPRESENTED**.\n- Current BU-SP1 state: **32 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 10 INVESTIGATE = 52**.\n- All identity work remained report/crosswalk-only; Tamil / released-English mutations **0 / 0**.\n\n## Next activity\n\nRun **BU-SP1 Identity Investigation Batch 3 — final rows 43–52**. Entry 43 is already locked as a distinct 15-01-1995 Pongal / Sun TV `Thamizh Maalai` work and is not item 18; establish repository representation for all ten from actual payload/source context.\n'''
          p.write_text(t, encoding='utf-8')

          # Master crosswalk tail.
          p = Path('secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md')
          t = p.read_text(encoding='utf-8')
          marker = '## Exact next activity\n\nRun BU-SP1 identity investigation Batch 1'
          if marker not in t:
              raise SystemExit('MASTER next marker missing')
          t = t.split('## Exact next activity\n',1)[0] + '''## BU-SP1 identity investigation Batches 1–2 — COMPLETE\n\nReports: `comparisons/10-shower-of-poetry-vol-1-identity-investigation-batch-01.md` and `comparisons/11-shower-of-poetry-vol-1-identity-investigation-batch-02.md`. Ten new matches and ten NOT-YET-REPRESENTED dispositions were hardened with **0 / 0** Tamil/English mutation. BU-SP1 now stands at **32 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 10 INVESTIGATE**.\n\nFour-book hardened tally: **67 MATCHED / 0 POSSIBLE / 49 NOT YET REPRESENTED / 60 INVESTIGATE = 176**.\n\n## Exact next activity\n\nRun **BU-SP1 Identity Investigation Batch 3 — entries 43–52**. Identity/crosswalk only; no Tamil or released-English mutation.\n'''
          p.write_text(t, encoding='utf-8')

          # Root HANDOVER tail.
          p = Path('HANDOVER.md')
          t = p.read_text(encoding='utf-8')
          marker = '## Exact next activity\n\nRun **BU-SP1 identity investigation Batch 1**'
          if marker not in t:
              raise SystemExit('HANDOVER next marker missing')
          before, rest = t.split('## Exact next activity\n',1)
          release_marker = '## Release-cleared work rule\n'
          release = release_marker + rest.split(release_marker,1)[1]
          closure = '''## BU-SP1 identity investigation Batches 1–2 — COMPLETE\n\nReports `comparisons/10-shower-of-poetry-vol-1-identity-investigation-batch-01.md` and `comparisons/11-shower-of-poetry-vol-1-identity-investigation-batch-02.md`. Hardened **10 new MATCHED** identities and **10 NOT YET REPRESENTED** dispositions from exact witness payload/context. BU-SP1 current state: **32 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 10 INVESTIGATE**. Four-book current tally: **67 MATCHED / 0 POSSIBLE / 49 NOT YET REPRESENTED / 60 INVESTIGATE = 176**. Tamil / released-English mutations: **0 / 0**.\n\n## Exact next activity\n\nRun **BU-SP1 Identity Investigation Batch 3 — final entries 43–52**. Establish repository representation from actual payload/source context only. Report/crosswalk only.\n\n'''
          p.write_text(before + closure + release, encoding='utf-8')

          # Next chat prompt: replace tally and tail.
          p = Path('NEXT_CHAT_PROMPT.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace('BU-SP1 remains **22 MATCHED / 0 POSSIBLE / 30 INVESTIGATE**.', 'The originally confirmed-MATCHED lane closed at 22/22; later identity Batches 1–2 harden the current BU-SP1 classification to **32 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 10 INVESTIGATE**.')
          marker = '## Exact next activity — BU-SP1 identity investigation Batch 1\n'
          if marker not in t:
              raise SystemExit('NEXT_CHAT marker missing')
          prefix = t.split(marker,1)[0]
          tail = '''## BU-SP1 identity investigation Batch 1 — COMPLETE\n\n`comparisons/10-shower-of-poetry-vol-1-identity-investigation-batch-01.md`: entries **2, 5, 6, 7, 17, 20, 24 MATCHED**; **3, 4, 10 NOT YET REPRESENTED**. The Pari witness is the 1971 source work despite BU's secondary 1970 date error.\n\n## BU-SP1 identity investigation Batch 2 — COMPLETE\n\n`comparisons/11-shower-of-poetry-vol-1-identity-investigation-batch-02.md`: entries **29, 41, 42 MATCHED**; **31, 32, 34, 35, 36, 37, 38 NOT YET REPRESENTED**. Exact physical pages **166–205** were directly rendered from checksum-locked Volume-I bytes; no OCR reconstruction.\n\nCurrent BU-SP1: **32 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 10 INVESTIGATE = 52**. Four-book total: **67 MATCHED / 0 POSSIBLE / 49 NOT YET REPRESENTED / 60 INVESTIGATE = 176**. No Tamil or released-English text was changed.\n\n## Exact next activity — BU-SP1 identity investigation Batch 3\n\nInvestigate the final Volume-I rows **43, 44, 45, 46, 47, 48, 49, 50, 51 and 52**. Entry 43 is already known to be a distinct **15-01-1995 Pongal / Sun TV `Thamizh Maalai`** `Calculation-2` work and is NOT item 18. Read actual payloads and establish current repository representation, if any. Report/crosswalk only; do not mutate FINAL-CLEARED Tamil or RELEASE-CLEARED English.\n'''
          p.write_text(prefix + tail, encoding='utf-8')

          # Phase plan.
          p = Path('TRANSCRIPTION_PHASE_PLAN.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace('classifications: **57 MATCHED / 0 POSSIBLE / 39 NOT YET REPRESENTED / 80 INVESTIGATE**;', 'classifications: **67 MATCHED / 0 POSSIBLE / 49 NOT YET REPRESENTED / 60 INVESTIGATE**;')
          t = t.replace('Current Volume-I classification: **22 MATCHED / 0 POSSIBLE / 30 INVESTIGATE**.', 'The 22 originally confirmed matches are payload-compared; identity Batches 1–2 later harden current Volume-I classification to **32 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 10 INVESTIGATE**.')
          start = t.index('### Current comparison activity — NEXT\n')
          end = t.index('## Most recently completed Tamil work', start)
          replacement = '''### BU-SP1 identity investigation Batch 1 — COMPLETE\n\nReport `comparisons/10-shower-of-poetry-vol-1-identity-investigation-batch-01.md`: **7 MATCHED / 3 NOT YET REPRESENTED**, mutations **0 / 0**.\n\n### BU-SP1 identity investigation Batch 2 — COMPLETE\n\nReport `comparisons/11-shower-of-poetry-vol-1-identity-investigation-batch-02.md`: **3 MATCHED / 7 NOT YET REPRESENTED**, mutations **0 / 0**. Current Volume-I state: **32 MATCHED / 0 POSSIBLE / 10 NOT YET REPRESENTED / 10 INVESTIGATE**.\n\n### Current comparison activity — NEXT\n\n**BU-SP1 identity investigation Batch 3** — final entries **43–52**. Harden identities from actual payload/event/source context; report/crosswalk only.\n\n### Planned sequence after BU-SP1 identity closure\n\n1. close/consolidate Volume-I identity state;\n2. BU-SP3 — item-level matching for remaining INVESTIGATE entries;\n3. BU-SP2 — retain not-yet-represented entries until source-backed identities are established.\n\n'''
          t = t[:start] + replacement + t[end:]
          t = t.replace('Proceed with **BU-SP1 identity investigation Batch 1 — entries 2, 3, 4, 5, 6, 7, 10, 17, 20 and 24 — identity/crosswalk report only**.', 'Proceed with **BU-SP1 identity investigation Batch 3 — final entries 43–52 — identity/crosswalk report only**.')
          p.write_text(t, encoding='utf-8')

          # Root README — correct high-level secondary-witness state/next activity.
          p = Path('README.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace('Their **176 TOC entries** are durably indexed at `secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md`: **55 MATCHED / 3 POSSIBLE / 39 NOT YET REPRESENTED / 79 INVESTIGATE**.', 'Their **176 TOC entries** are durably indexed at `secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md`. Current hardened state after BU-TT closure and BU-SP1 identity Batches 1–2: **67 MATCHED / 0 POSSIBLE / 49 NOT YET REPRESENTED / 60 INVESTIGATE**.')
          old = 'Exact next secondary-witness activity: **Batch 1 — compare Volume-II pp.85–89 `The Brother for the Head did Ask!` against release-cleared `poems/thalaikettan-thambi/`, producing a comparison report only.**'
          new = 'Exact next secondary-witness activity: **BU-SP1 Identity Investigation Batch 3 — final Volume-I entries 43–52; report/crosswalk only, no Tamil or released-English mutation.**'
          if old in t:
              t = t.replace(old,new,1)
          old2 = 'Current next activity: **Bharathiar University Secondary Witness Comparison Batch 1 — `தலைகேட்டான் தம்பி`; report-only, no direct text mutation.**'
          if old2 in t:
              t = t.replace(old2, 'Current next activity: **BU-SP1 Identity Investigation Batch 3 — entries 43–52; report/crosswalk only.**',1)
          p.write_text(t, encoding='utf-8')

      - name: Commit synchronized records
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secondary-witnesses/bharathiar-university/shower-of-poetry-vol-1/crosswalk.md \
                  secondary-witnesses/bharathiar-university/README.md \
                  secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md \
                  HANDOVER.md NEXT_CHAT_PROMPT.md TRANSCRIPTION_PHASE_PLAN.md README.md
          git commit -m 'Synchronize BU-SP1 identity batches 1 and 2 [skip ci]'
          git push
