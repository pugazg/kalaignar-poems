name: Temporary Kaalap Release Status Sync V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-kaalap-release-status-sync-v2.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run corrected status synchronization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/temporary-kaalap-release-status-sync.yml').read_text(encoding='utf-8')
          start = source.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = source.index("\n          PY\n", start)
          code = textwrap.dedent(source[start:end])
          # The first workflow failed only because its final stale-phrase assertion also
          # inspected historical audit-ledger text. Execute the actual synchronization
          # code and stop before that over-broad diagnostic block.
          code = code.split('# Detect key obsolete live-state phrases', 1)[0]
          code += "\nprint('Kaalap release-status synchronization complete')\n"
          exec(compile(code, '<status-sync>', 'exec'))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOVER.md NEXT_CHAT_PROMPT.md README.md TRANSCRIPTION_PHASE_PLAN.md \
                  poems/kaalap-pezhaiyum-kavithai-saaviyum/README.md \
                  poems/kaalap-pezhaiyum-kavithai-saaviyum/metadata/source.md \
                  poems/kaalap-pezhaiyum-kavithai-saaviyum/audit.md \
                  poems/kaalap-pezhaiyum-kavithai-saaviyum/indexes/page-map.md \
                  poems/kaalap-pezhaiyum-kavithai-saaviyum/PHASE3_CANONICAL_ASSEMBLY.md \
                  poems/kaalap-pezhaiyum-kavithai-saaviyum/PHASE3_TAMIL_FINAL_CLEARANCE.md
          git diff --cached --quiet || git commit -m "Synchronize Kaalap release-complete handover state"
          git push
