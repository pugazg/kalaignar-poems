name: Bind Kalaignarin Kavithaigal Batch 10 blobs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase4-batch10-bind.yml'
      - 'scripts/bind-kalaignarin-kavithaigal-batch10.py'

permissions:
  contents: write

jobs:
  bind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind final Batch 10 blob witnesses
        run: python3 scripts/bind-kalaignarin-kavithaigal-batch10.py
      - name: Remove one-shot binder
        run: |
          rm -f .github/workflows/phase4-batch10-bind.yml
          rm -f scripts/bind-kalaignarin-kavithaigal-batch10.py
      - name: Commit blob witness binding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Bind Kalaignarin Kavithaigal Batch 10 review to final item blobs'
          git push origin main
