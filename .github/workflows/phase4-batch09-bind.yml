name: Bind Kalaignarin Kavithaigal Batch 09 blobs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase4-batch09-bind.yml'

permissions:
  contents: write

jobs:
  bind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bind final reviewed blob witnesses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('poems/kalaignarin-kavithaigal/translations/en/batches/batch-09.md')
          t = p.read_text(encoding='utf-8')
          old = 'Final reviewed blob SHAs will be appended after mechanical certification.'
          new = '''## Final reviewed item blob witnesses

These are the exact item blobs certified after `status` promotion to `batch-reviewed`:

- item 31 final blob: `20d3f8818ba495af8f2d28a8e5756664779431e9`;
- item 32 final blob: `4616106cac77bfa3f8df6dff51c6281bea771976`;
- item 33 final blob: `2a7fdf67240b63317c030c34b945e2ed7df18667`;
- item 34 final blob: `d382675b4bd9a087a6b0be1bcfd536f6c1d42316`;
- item 35 final blob: `b2be1dbe7f0f18c0da2e7aaf14b0aa00f1388609`.'''
          if old not in t:
              raise SystemExit('binding placeholder missing')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-shot binder
        run: rm -f .github/workflows/phase4-batch09-bind.yml
      - name: Commit blob binding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Bind Kalaignarin Kavithaigal Batch 09 review to final item blobs'
          git push origin main
