name: Assemble Kaalap English Collection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/assemble-kaalap-english.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify assembly and synchronize status
        run: python3 .github/scripts/sync-kaalap-assembly-status.py
      - name: Commit synchronized status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/kaalap-pezhaiyum-kavithai-saaviyum-en.md
          git add poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/README.md
          git add poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/TRANSLATION_PLAN.md
          git add poems/kaalap-pezhaiyum-kavithai-saaviyum/translations/en/SOURCE_MAP.md
          if git diff --cached --quiet; then
            echo "No status change"
            exit 0
          fi
          git commit -m "Mark complete English collection assembly"
          git push origin HEAD:main
