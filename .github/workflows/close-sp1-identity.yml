name: Close BU-SP1 identity hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/close-sp1-identity.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize identity records
        shell: python
        run: |
          from pathlib import Path

          # BU-SP1 crosswalk
          p = Path('secondary-witnesses/bharathiar-university/shower-of-poetry-vol-1/crosswalk.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace('| 8 | The Beloved Son of the Muse of Arts | 20 | **POSSIBLE** | poems/kalaignarin-kavithaigal/ item 40 | close title: Mother Art\'s Foremost Son; confirm payload before treating as same |', '| 8 | The Beloved Son of the Muse of Arts | 20 | **MATCHED** | poems/kalaignarin-kavithaigal/ item 40 | payload match confirmed: Kalaivanar / N. S. Krishnan elegy, same imagery and film-title sequence |')
          t = t.replace('| 18 | Calculation - 1 | 85 | **POSSIBLE** | poems/kalaignarin-kavithaigal/ item 18 | repository has one `கணக்கு` / Arithmetic item; Volume I splits Calculation 1/2 |', '| 18 | Calculation - 1 | 85 | **MATCHED** | poems/kalaignarin-kavithaigal/ item 18 | exact 02-08-1970 Salem Tamil Sangam `கணக்கு` payload and event match |')
          t = t.replace('| 43 | Calculation-2 | 182 | **POSSIBLE** | poems/kalaignarin-kavithaigal/ item 18 | repository has one `கணக்கு` / Arithmetic item; Volume I splits Calculation 1/2 |', '| 43 | Calculation-2 | 182 | **INVESTIGATE** | — | distinct 15-01-1995 Pongal / Sun TV `Thamizh Maalai` work; NOT repository item 18 (02-08-1970 Salem) |')
          t = t.replace('**20 MATCHED / 3 POSSIBLE / 29 INVESTIGATE = 52.**', '**22 MATCHED / 0 POSSIBLE / 30 INVESTIGATE = 52.**')
          t += '''\n\n## Identity-hardening result — 2026-09-08\n\nAuthority: `../comparisons/06-shower-of-poetry-vol-1-identity-hardening.md`.\n\nThe three former `POSSIBLE` rows are resolved: entry **8 MATCHED item 40**; entry **18 MATCHED item 18**; entry **43 is a DISTINCT 1995 work and is NOT item 18**, so its repository representation remains `INVESTIGATE`. No Tamil or released-English mutation occurred.\n\nCurrent tally: **22 MATCHED / 0 POSSIBLE / 30 INVESTIGATE = 52**.\n'''
          p.write_text(t, encoding='utf-8')

          # Secondary-witness README
          p = Path('secondary-witnesses/bharathiar-university/README.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace('- Volume I: **52** — 20 MATCHED / 3 POSSIBLE / 29 INVESTIGATE;', '- Volume I: **52** — 22 MATCHED / 0 POSSIBLE / 30 INVESTIGATE;')
          t = t.replace('Overall initial onboarding: **55 MATCHED / 3 POSSIBLE / 39 NOT YET REPRESENTED / 79 INVESTIGATE = 176**.', 'Current hardened crosswalk: **57 MATCHED / 0 POSSIBLE / 39 NOT YET REPRESENTED / 80 INVESTIGATE = 176**.')
          old = '''## Next activity\n\nProceed with **BU-SP1 identity hardening** for the three current `POSSIBLE` rows before broad Volume-I payload comparison:\n\n1. entry 8 **The Beloved Son of the Muse of Arts** → possible `poems/kalaignarin-kavithaigal/` item 40;\n2. entry 18 **Calculation - 1** → possible item 18;\n3. entry 43 **Calculation-2** → possible item 18.\n\nCompare payloads and classify each as MATCHED / distinct work or segment / not a match. This is identity/crosswalk work only; no Tamil or released-English mutation is authorized by the matching step.\n'''
          new = '''### BU-SP1 identity hardening — COMPLETE\n\nReport: `comparisons/06-shower-of-poetry-vol-1-identity-hardening.md`. Result: **3/3 former POSSIBLE rows resolved** — entry 8 MATCHED item 40; entry 18 MATCHED item 18; entry 43 is a distinct 1995 Pongal/Sun TV work and is NOT item 18, so it remains INVESTIGATE for repository representation. Mutations: **0 / 0**.\n\n## Next activity\n\nBegin BU-SP1 payload-comparison Batch 1 for the first **10 confirmed MATCHED entries in source order: 1, 8, 9, 11, 12, 13, 14, 15, 16 and 18**. Compare each against FINAL-CLEARED Tamil and RELEASE-CLEARED English and produce a report only.\n'''
          assert old in t
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          # Master crosswalk
          p = Path('secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace('| BU-SP1 | *Shower of Poetry*, Volume I | 249 | 101,936,284 | `f353a833679b1aa743b07ac0e586d99a43ca77ebfe14822e26879f0c5f9a7536` | 52 | 20 MATCHED / 3 POSSIBLE / 29 INVESTIGATE |', '| BU-SP1 | *Shower of Poetry*, Volume I | 249 | 101,936,284 | `f353a833679b1aa743b07ac0e586d99a43ca77ebfe14822e26879f0c5f9a7536` | 52 | 22 MATCHED / 0 POSSIBLE / 30 INVESTIGATE |')
          t = t.replace('**Total: 176 entries — 55 MATCHED / 3 POSSIBLE / 39 NOT YET REPRESENTED / 79 INVESTIGATE.**', '**Total: 176 entries — 57 MATCHED / 0 POSSIBLE / 39 NOT YET REPRESENTED / 80 INVESTIGATE.**')
          t = t.replace('Twenty Volume-I entries are high-confidence matches to stable items in `poems/kalaignarin-kavithaigal/`; three more are POSSIBLE and require payload comparison.', 'Twenty-two Volume-I entries are now high-confidence matches to stable items in `poems/kalaignarin-kavithaigal/`; all three former POSSIBLE rows have been hardened. Entry 43 `Calculation-2` is a distinct 15-01-1995 Pongal/Sun TV work and is not repository item 18.')
          old = '''## Exact next activity\n\nHarden the three BU-SP1 `POSSIBLE` identities by payload comparison:\n\n- entry 8 **The Beloved Son of the Muse of Arts** → possible `kalaignarin-kavithaigal` item 40;\n- entry 18 **Calculation - 1** → possible item 18;\n- entry 43 **Calculation-2** → possible item 18.\n\nClassify each relationship before beginning the 20 already-MATCHED Volume-I payload comparisons. No source/release mutation during identity hardening.\n'''
          new = '''## BU-SP1 identity hardening — COMPLETE\n\n`comparisons/06-shower-of-poetry-vol-1-identity-hardening.md` resolves all three former POSSIBLE rows: **8 → MATCHED item 40; 18 → MATCHED item 18; 43 → DISTINCT 1995 work / INVESTIGATE representation, not item 18**. Current BU-SP1 tally: **22 MATCHED / 0 POSSIBLE / 30 INVESTIGATE**.\n\n## Exact next activity\n\nCompare the first ten confirmed BU-SP1 MATCHED payloads in source order: **1, 8, 9, 11, 12, 13, 14, 15, 16, 18**. Report only; no Tamil/released-English mutation.\n'''
          assert old in t
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          # Root HANDOVER
          p = Path('HANDOVER.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace('Initial crosswalk: **176 entries = 55 MATCHED / 3 POSSIBLE / 39 NOT YET REPRESENTED / 79 INVESTIGATE**.', 'Current hardened crosswalk: **176 entries = 57 MATCHED / 0 POSSIBLE / 39 NOT YET REPRESENTED / 80 INVESTIGATE**.')
          old = '## Exact next activity\n\nProceed with **BU-SP1 identity hardening** for three `POSSIBLE` rows: entry 8 → possible `kalaignarin-kavithaigal` item 40; entries 18 and 43 (`Calculation - 1/-2`) → possible item 18. Compare payloads and harden each relationship before broad Volume-I witness comparison. No Tamil/release mutation in the identity step.\n\n'
          new = '''## BU-SP1 identity hardening — COMPLETE\n\nReport `secondary-witnesses/bharathiar-university/comparisons/06-shower-of-poetry-vol-1-identity-hardening.md`: **entry 8 MATCHED item 40; entry 18 MATCHED item 18; entry 43 DISTINCT 1995 work / not item 18, representation INVESTIGATE**. BU-SP1 is now **22 MATCHED / 0 POSSIBLE / 30 INVESTIGATE**. Tamil/released-English mutations **0 / 0**.\n\n## Exact next activity\n\nRun BU-SP1 payload-comparison Batch 1 for confirmed MATCHED entries **1, 8, 9, 11, 12, 13, 14, 15, 16 and 18**, report-only.\n\n'''
          assert old in t
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          # NEXT_CHAT_PROMPT
          p = Path('NEXT_CHAT_PROMPT.md')
          t = p.read_text(encoding='utf-8')
          marker = '## Exact next activity — BU-SP1 identity hardening\n'
          assert marker in t
          t = t.split(marker, 1)[0] + '''## BU-SP1 identity hardening — COMPLETE\n\nReport: `secondary-witnesses/bharathiar-university/comparisons/06-shower-of-poetry-vol-1-identity-hardening.md`.\n\n- entry 8 **The Beloved Son of the Muse of Arts** → **MATCHED** `kalaignarin-kavithaigal` item 40;\n- entry 18 **Calculation - 1** → **MATCHED** item 18 (`கணக்கு`, Salem Tamil Sangam, 02-08-1970);\n- entry 43 **Calculation-2** → **DISTINCT WORK**, dated 15-01-1995 Pongal / Sun TV `Thamizh Maalai`; NOT item 18; repository representation remains INVESTIGATE.\n\nBU-SP1 tally: **22 MATCHED / 0 POSSIBLE / 30 INVESTIGATE**. No Tamil or released-English mutation occurred.\n\n## Exact next activity — BU-SP1 payload comparison Batch 1\n\nCompare confirmed MATCHED entries **1, 8, 9, 11, 12, 13, 14, 15, 16 and 18** against their FINAL-CLEARED Tamil and RELEASE-CLEARED English targets. Classify title, semantics, omissions/condensation, expansion, transliteration and structure. Produce one durable report only; do not mutate Tamil or released English.\n'''
          p.write_text(t, encoding='utf-8')

          # Phase plan
          p = Path('TRANSCRIPTION_PHASE_PLAN.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace('- classifications: **55 MATCHED / 3 POSSIBLE / 39 NOT YET REPRESENTED / 79 INVESTIGATE**;', '- classifications: **57 MATCHED / 0 POSSIBLE / 39 NOT YET REPRESENTED / 80 INVESTIGATE**;')
          old = '''### Current comparison activity — NEXT\n\n**BU-SP1 identity hardening — three POSSIBLE rows.**\n\n- entry 8 **The Beloved Son of the Muse of Arts** → possible `kalaignarin-kavithaigal` item 40;\n- entry 18 **Calculation - 1** → possible item 18;\n- entry 43 **Calculation-2** → possible item 18.\n\nOperation: inspect Volume-I payloads and relevant FINAL-CLEARED repository items, then classify MATCHED / distinct segment or work / not a match. Update only witness identity/crosswalk records. No Tamil or released-English mutation.\n\n### Planned sequence after identity hardening\n\n1. BU-SP1 — compare confirmed MATCHED payloads;\n2. BU-SP1 — investigate remaining unmapped entries;\n3. BU-SP3 — item-level matching for 50 INVESTIGATE entries;\n4. BU-SP2 — retain not-yet-represented entries until source-backed identities are established.\n'''
          new = '''### BU-SP1 identity hardening — COMPLETE\n\nReport `comparisons/06-shower-of-poetry-vol-1-identity-hardening.md`. Former POSSIBLE rows resolved **3/3**: entry 8 MATCHED item 40; entry 18 MATCHED item 18; entry 43 is a distinct 1995 Pongal/Sun TV work, not item 18, and remains INVESTIGATE for representation. Current Volume-I tally: **22 MATCHED / 0 POSSIBLE / 30 INVESTIGATE**.\n\n### Current comparison activity — NEXT\n\n**BU-SP1 payload-comparison Batch 1** — confirmed MATCHED entries **1, 8, 9, 11, 12, 13, 14, 15, 16, 18**. Report-only; no Tamil or released-English mutation.\n\n### Planned sequence after Batch 1\n\n1. continue BU-SP1 confirmed-MATCHED payload comparisons;\n2. investigate BU-SP1 remaining 30 unmapped entries;\n3. BU-SP3 — item-level matching for 50 INVESTIGATE entries;\n4. BU-SP2 — retain not-yet-represented entries until source-backed identities are established.\n'''
          assert old in t
          t = t.replace(old, new, 1)
          old2 = '## Exact next activity\n\nProceed with **BU-TT Secondary Witness Comparison Batch 5 — mapped entries 31–34 — report only**, then summarize the complete 34-entry Treasure Trove witness comparison.\n'
          new2 = '## Exact next activity\n\nProceed with **BU-SP1 payload-comparison Batch 1 — entries 1, 8, 9, 11, 12, 13, 14, 15, 16 and 18 — report only**.\n'
          assert old2 in t
          p.write_text(t.replace(old2, new2, 1), encoding='utf-8')

      - name: Commit synchronized records
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secondary-witnesses/bharathiar-university/shower-of-poetry-vol-1/crosswalk.md \
                  secondary-witnesses/bharathiar-university/README.md \
                  secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md \
                  HANDOVER.md NEXT_CHAT_PROMPT.md TRANSCRIPTION_PHASE_PLAN.md
          git commit -m 'Close BU-SP1 identity hardening [skip ci]'
          git push
