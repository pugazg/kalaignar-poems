name: Run BU-SP3 Batch 2 sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-sync-bu-sp3-batch2.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply synchronization
        run: python .github/scripts/sync_bu_sp3_batch2.py
      - name: Commit synchronized state
        run: |
          git config user.name "pugazg"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOVER.md TRANSCRIPTION_PHASE_PLAN.md README.md secondary-witnesses/bharathiar-university/README.md secondary-witnesses/bharathiar-university/MASTER_CROSSWALK.md secondary-witnesses/bharathiar-university/shower-of-poetry-vol-3/crosswalk.md
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize BU-SP3 identity Batch 2 state"
          git push origin HEAD:main
