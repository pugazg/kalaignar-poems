name: Gate4 Canonical Assembly

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gate4-canonical-assembly.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Gate 4 outputs
        run: python3 .github/gate4_assemble.py
      - name: Commit Gate 4 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poems/kalaignarin-kavithaigal/sections/kalaignarin-kavithaigal.md
          git add poems/kalaignarin-kavithaigal/indexes/canonical-source-map.md
          git add poems/kalaignarin-kavithaigal/PHASE3_CANONICAL_ASSEMBLY.md
          git diff --cached --check
          git commit -m "Assemble Kalaignarin Kavithaigal canonical Tamil layer"
          git push origin HEAD:main
