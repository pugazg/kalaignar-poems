name: Inspect BU-SP1 Batch 3 source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-bu-sp1-batch3.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install PDF and OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr

      - name: Download and checksum-lock BU-SP1
        shell: bash
        run: |
          set -euo pipefail
          url='https://commons.wikimedia.org/wiki/Special:Redirect/file/Shower_of_poetry_Vol_1.pdf'
          curl -fL --retry 4 --retry-delay 2 "$url" -o bu-sp1.pdf
          actual="$(sha256sum bu-sp1.pdf | awk '{print $1}')"
          expected='f353a833679b1aa743b07ac0e586d99a43ca77ebfe14822e26879f0c5f9a7536'
          echo "SHA-256: $actual"
          test "$actual" = "$expected"
          pages="$(pdfinfo bu-sp1.pdf | awk '/^Pages:/ {print $2}')"
          bytes="$(stat -c '%s' bu-sp1.pdf)"
          echo "Physical pages: $pages"
          echo "Bytes: $bytes"
          test "$pages" = '249'
          test "$bytes" = '101936284'

      - name: Render unresolved witness pages and OCR once
        shell: bash
        run: |
          set -euo pipefail
          mkdir rendered
          pdftoppm -f 210 -l 213 -r 110 -jpeg -gray bu-sp1.pdf rendered/a >/dev/null 2>&1
          pdftoppm -f 229 -l 231 -r 110 -jpeg -gray bu-sp1.pdf rendered/b >/dev/null 2>&1
          pdftoppm -f 235 -l 240 -r 110 -jpeg -gray bu-sp1.pdf rendered/c >/dev/null 2>&1
          pdftoppm -f 244 -l 249 -r 110 -jpeg -gray bu-sp1.pdf rendered/d >/dev/null 2>&1
          printf '%s\n' rendered/a-*.jpg rendered/b-*.jpg rendered/c-*.jpg rendered/d-*.jpg > images.txt
          test "$(wc -l < images.txt)" = '19'
          tesseract images.txt unresolved -l eng --psm 6 >/dev/null 2>&1

      - name: Emit unresolved entry payloads
        shell: python
        run: |
          from pathlib import Path

          raw = Path('unresolved.txt').read_text(encoding='utf-8', errors='replace')
          blocks = raw.split('\f')
          if blocks and not blocks[-1].strip():
              blocks.pop()
          physical = list(range(210,214)) + list(range(229,232)) + list(range(235,241)) + list(range(244,250))
          print(f'OCR page blocks: {len(blocks)}')
          print(f'Expected physical page list: {physical}')
          if len(blocks) != len(physical):
              raise SystemExit(f'expected {len(physical)} OCR page blocks, got {len(blocks)}')
          by_page = {p: text.strip() for p, text in zip(physical, blocks)}
          entries = {
              44: ('In Search of Human Love', 210, 213),
              47: ("The Sweet Word that doesn't Satiate", 229, 231),
              49: ('Do not Drive These Women away, and Do not Their Dislike Earn!', 235, 237),
              50: ('A Radiant Light of Culture', 238, 240),
              52: ('Indication of a Dawn!', 244, 249),
          }
          for n, (title, start, end) in entries.items():
              text = '\n\n'.join(f'--- physical page {p} ---\n{by_page[p]}' for p in range(start, end+1))
              if len(text) > 9000:
                  text = text[:4500] + '\n\n...[middle omitted from log only]...\n\n' + text[-4500:]
              print('\n' + '='*72)
              print(f'BU-SP1 ENTRY {n}: {title} | physical {start}-{end}')
              print('='*72)
              print(text)
