          - Entry **45** was checked against FINAL-CLEARED `poems/kalaignarin-kavithaigal/sections/67.md`; the shared panchayat/fraud/refrain architecture establishes identity beyond English-title resemblance.
          - The remaining nine rows were checked conservatively against current repository inventories and distinctive payload markers. No high-confidence current work/item identity was established.
          - Entry **50** is not `கலைஞரின் கவிதைகள்` item 44: that repository item is explicitly the Kannadasan elegy `என் இனிய நண்பா! ஏன் பிரிந்தாய்?`, while BU entry 50 is the Moopanar/Kapisthalam elegy.
