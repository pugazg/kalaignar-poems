name: Synchronize BU-SP1 Batch 3 state

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-bu-sp1-batch3.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize Batch 3 report and status documents
        shell: python
        run: |
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one occurrence, found {count}')
              return text.replace(old, new, 1)

          report_path = Path('secondary-witnesses/bharathiar-university/comparisons/12-shower-of-poetry-vol-1-identity-investigation-batch-03.md')
          if report_path.exists():
              raise SystemExit(f'{report_path} already exists; refusing to overwrite newer durable work')

          report = '''# BU-SP1 Identity Investigation Batch 3

          Witness: **Bharathiar University / Macmillan, _Shower of Poetry_, Volume I (2009)**  
          Authority class: **institutional secondary English witness only**  
          Exact witness identity: **249 physical pages / 101,936,284 bytes / SHA-256 `f353a833679b1aa743b07ac0e586d99a43ca77ebfe14822e26879f0c5f9a7536`**.

          ## Scope

          Investigated the final ten Volume-I identity rows: **43–52**.

          The normal conversation renderer exposes only the first 150 pages of this 249-page image-only witness. For this batch, the same public source was downloaded in a one-time repository workflow and independently locked to the recorded **page count, byte size and SHA-256** before physical pages **206–249** were rendered. English OCR over those exact-byte renders was used only as a **reading/navigation aid for secondary-witness identity**. It was not used to reconstruct Tamil, replace a controlling source, or mutate any FINAL-CLEARED Tamil or RELEASE-CLEARED English text.

          Identity decisions below use distinctive payload, event/date/person context and current repository canonical inventories. `NOT YET REPRESENTED` means that no exact current repository representation was established in this pass; it is not a historical claim that the work never appeared elsewhere.

          ## Results

          | BU entry | BU title | Result | Repository target / disposition | Evidence |
          |---:|---|---|---|---|
          | 43 | `Calculation-2` | **NOT YET REPRESENTED** | — | Distinct **15-01-1995** Pongal / Sun TV `Thamizh Maalai` presiding poem on `Calculation`: Tamil/classical-literature prelude, Independence-Day reckoning, accounts, `Kanakkupillai` and bribery wordplay. The earlier negative lock stands: this is **not** 1970 Salem item 18 `கணக்கு`; no other current representation was established. |
          | 44 | `In Search of Human Love` | **NOT YET REPRESENTED** | — | Distinct **03-06-1995** age-71 birthday/cadre poem: mother/father/sisters/wife/children contrasted with the joy received from movement brothers; Periyar–Anna path, Hindi imposition, social justice, Palestine, South Africa, Eelam, secularism and a closing Tamil-land/language oath. No current source-backed repository target was established. |
          | 45 | `A Petty Village Full of Folks Illiterate!` | **MATCHED** | `poems/kalaignarin-kavithaigal/` item **67** `பாமரர் நிறைந்த பட்டிக்காடு!` | Payload identity is direct and sustained: illiterate-majority panchayat refrain, literate minority suppressed, barking dogs silenced with bread, the deceptive `மாயை`/fraud, corruption, Panchali-Devi newspaper burning, yes-men, absurd drumstick/candlestick claims and hand-raising followers all correspond. |
          | 46 | `Inauguration of the Valluvar Statue` | **NOT YET REPRESENTED** | — | Long Kanyakumari Valluvar-statue poetic-symposium presidential address: Tamil/Kural praise, Prof. Anbazhagan, Aram–Porul–Inbam, the 38 Virtue chapters as statue base and introductions to participating poets. Witness note dates the symposium **31-12-1999** and statue inauguration **01-01-2000**. No current repository representation was established. |
          | 47 | `The Sweet Word that doesn't Satiate` | **NOT YET REPRESENTED** | — | Distinct **17-06-2001** poem in which flowers, moon, clouds, deer and peacocks protest their overuse as poetic comparisons; the one inexhaustible, incomparable name is finally revealed as **Anna**. No current source-backed repository representation was established. |
          | 48 | `Socialism Proclaimed in a Puram Poem` | **NOT YET REPRESENTED** | — | Distinct **21-06-2001** Sangam/socialism poem: addresses wealth accumulated from toilers, invokes Anna's food/wealth question, identifies Nakkeeran's ancient formulation, contrasts king and hunter, and closes with **Puranaanooru 189** and equitable distribution / giving as the purpose of wealth. No current representation was established. |
          | 49 | `Do not Drive These Women away, and Do not Their Dislike Earn!` | **NOT YET REPRESENTED** | — | Distinct **22-07-2001** Thanjai Rationalists' Conference episode: Veeramani offers a knife to cut four women's `thali`; Kalaignar rejects public cutting of already-worn marriage threads while affirming that self-respect marriage need not require one, and asks that women entering the rationalist path not be alienated. No current representation was established. |
          | 50 | `A Radiant Light of Culture` | **NOT YET REPRESENTED** | — | Distinct **September 2001** Moopanar/Karuppiah elegy: Kapisthalam/Kaveri setting, generosity and simplicity, friendship surviving political differences, and the Sivagangai shooting-rumour midnight-call anecdote. It closes that India lost a good leader and Kalaignar a good friend. No current repository representation was established. |
