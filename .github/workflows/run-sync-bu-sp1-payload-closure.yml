name: Synchronize BU-SP1 payload closure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-sync-bu-sp1-payload-closure.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize durable closure state
        run: python .github/scripts/sync_bu_sp1_payload_closure.py
      - name: Commit synchronized closure state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Close Bharathiar matched payload comparison lane"
            git push
          fi
